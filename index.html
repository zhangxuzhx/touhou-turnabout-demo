"这些铜钱就是赛钱箱里的" · 正解：E5 赛钱箱账本|出示错误证物（通用）',batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:'▶ 终局出示 2（绝杀）：证明"这些铜钱就是赛钱箱里的" · 正解：E5 赛钱箱账本',h4:"出示错误证物（通用）",lines:[{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"此物无从证明铜钱之来历。博丽灵梦，你的善行扣除一星。"}]},{key:'4|25|▶ 终局出示 2（绝杀）：证明"这些铜钱就是赛钱箱里的" · 正解：E5 赛钱箱账本|出示 E5 赛钱箱账本（正解）',batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:'▶ 终局出示 2（绝杀）：证明"这些铜钱就是赛钱箱里的" · 正解：E5 赛钱箱账本',h4:"出示 E5 赛钱箱账本（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示 E5",text:"确凿凭据，就在我那天早上数了整整三遍的账本上。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"账本上记着，那天早上塞进箱子里的，除了三十七枚铜钱，本来还有一包供品洋糖。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"箱子被撞碎之后，洋糖和铜钱混在一起撒了一地。这个贪嘴的家伙在黑暗里摸索着，一把全抓进了兜里。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"糖早就吃光了，剩下的铜钱被她当成硬糖嚼了一路——所以每一枚上面都有牙印，兜里还剩着一张糖纸。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"更何况，冰面上剩下的十二枚，加上她口袋里掏出来的二十五枚——合起来不多不少，正好就是我账本上记着的三十七枚。"},{t:"fx",label:"演出",text:"文彻底破防——手里的相机差点摔在地上，敬语瞬间掉光，跳脚大喊"},{t:"say",who:"文",inner:!1,act:"气急败坏",text:"什、什么叫撞碎箱子摸走糖？！怎么会变成一桩小妖怪迷路撞箱子的乌龙事件啊！那我写的头版头条《红魔馆门前的冰之恶魔》岂不是全成了笑话了吗！！"}]},{key:"4|26||",batch:4,sec:"26",secTitle:"判决",h3:"",h4:"",lines:[{t:"sfx",text:"悔悟棒重重敲击桌面"},{t:"say",who:"映姬",inner:!1,act:"",text:"肃静。全案事实既已查明，本庭现在宣判。"},{t:"say",who:"映姬",inner:!1,act:"",text:"其一，被告琪露诺，毁坏赛钱箱及盗窃香火钱之罪名不成立，当庭宣判无罪。"},{t:"say",who:"映姬",inner:!1,act:"",text:"然其无故冰封博丽神社属实，判处即日将神社境内积冰尽数融化，并亲手重洗全部冻硬之衣物。"},{t:"say",who:"琪露诺",inner:!1,act:"先是一愣，随即高举双手欢呼",text:"好耶——！最强的我是无罪的！……咦，不对，为什么最强的我要去给灵梦洗床单啦？！"},{t:"say",who:"映姬",inner:!1,act:"",text:"其二，证人露米娅，系过失撞毁赛钱箱、误拾香火钱。判处将二十五枚铜钱当庭归还，并留在博丽神社打工劳役，直至抵清重造赛钱箱之费用。"},{t:"say",who:"露米娅",inner:!1,act:"歪头举手",text:"打工是什么意思呀～？只要灵梦管饭的话，是这样也可以哦～"},{t:"say",who:"映姬",inner:!1,act:"",text:"其三，检方射命丸文。未加核实便夸大标题、诱导证人，几近酿成冤案。判处《文文。新闻》于头版连续三日刊登更正启事，向被告及公众致歉。"},{t:"say",who:"文",inner:!1,act:"抱头惨叫",text:"头版连登三天更正启事？！那我的报纸岂不是要沦为全幻想乡的笑柄了！我不服——！"},{t:"say",who:"映姬",inner:!1,act:"目光转向辩护席，举起悔悟棒",text:"至于辩护人博丽灵梦。以受害人身份兼任辩护，未得钱财便先行赊账，更把晾衣绳拴在神圣的鸟居上——"},{t:"say",who:"映姬",inner:!1,act:"",text:"博丽灵梦，你就是太不敬神了。"},{t:"say",who:"灵梦",inner:!1,act:"空手做端茶动作，别过脸",text:"……嗯。受教了，阎魔大人。"},{t:"say",who:"映姬",inner:!1,act:"",text:"是非曲直公堂第一庭，退庭！"},{t:"sfx",text:"悔悟棒敲击声，闭庭"}]},{key:"4|27||",batch:4,sec:"27",secTitle:"尾声 · 第一被告休息室",h3:"",h4:"",lines:[{t:"fx",label:"画面",text:"同日 · 是非曲直公堂 · 第一被告休息室"},{t:"bgm",text:"悠闲轻快的日常曲"},{t:"say",who:"魔理沙",inner:!1,act:"伸了个大大的懒腰",text:"呼——！总算是大获全胜咯！不仅把小冰精捞了出来，还白捡了两个免费苦力，灵梦你这回可不亏啊！"},{t:"say",who:"琪露诺",inner:!1,act:"垂头丧气地抱着一大摞冻床单",text:"呜呜……为什么最强的我要干洗衣工的活啦……"},{t:"say",who:"露米娅",inner:!1,act:"跟在后面晃悠",text:"灵梦灵梦，洗完床单今天中午吃什么呀～？"},{t:"say",who:"灵梦",inner:!1,act:"黑着脸坐在桌前，盯着桌上那堆铜钱叹气",text:"哈啊……什么叫不亏。你来看看这二十五枚铜钱。"},{t:"say",who:"魔理沙",inner:!1,act:"凑过去看",text:"呃……每一枚上面都被露米娅啃出了两个深深的牙印。怎么了，带牙印的钱也是钱啊？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……人里点心铺的老板今天跑来凑热闹，刚才就坐在旁听席后排。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"散庭的时候，他专门托小町带话过来——说是带妖怪牙印的铜钱太瘆人，他店里死活不收。"},{t:"say",who:"魔理沙",inner:!1,act:"噗嗤笑出声",text:"哈哈哈哈！那你赊的那大包高级仙贝，岂不是还得另外掏腰包还账？！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……吵死了。谁敢不收，我明天就带着露米娅去他店门口站岗。"},{t:"fx",label:"演出",text:"灵梦没好气地把铜钱扫进钱袋"},{t:"say",who:"魔理沙",inner:!1,act:"单手托着下巴，若有所思",text:"不过话说回来，灵梦。今天公堂上摆出来的那一堆证物里，你不觉得有一件东西……从头到尾都有点说不上来的古怪吗？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……原来你也注意到了。刚才在庭上我就觉得有件东西不太对劲，到底是哪一件来着。"}]},{key:"4|27|尾声 · 出示 E11 露米娅的口袋|",batch:4,sec:"27",secTitle:"尾声 · 第一被告休息室",h3:"尾声 · 出示 E11 露米娅的口袋",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"从露米娅口袋里翻出来的那堆杂物中，捻起一张花花绿绿的糖纸",text:"……就是这个。那包供品洋糖剩下的糖纸。"}]},{key:"4|27|尾声 · 出示 E5 赛钱箱账本|",batch:4,sec:"27",secTitle:"尾声 · 第一被告休息室",h3:"尾声 · 出示 E5 赛钱箱账本",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"翻开账本指了指",text:'我这本账本上记着，那天早上箱子里除了三十七枚铜钱，本来还有"洋糖一包"。'},{t:"say",who:"灵梦",inner:!1,act:"从桌上露米娅刚才掏出的杂物里，捻起那张糖纸",text:"糖虽然被这贪嘴的家伙吃光了，但剩下来的这张糖纸……确实有点古怪。"}]},{key:"4|27|尾声 · 糖纸（出示 E11 或 E5 之后）|",batch:4,sec:"27",secTitle:"尾声 · 第一被告休息室",h3:"尾声 · 糖纸（出示 E11 或 E5 之后）",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"凑过来瞧",text:"嗯？不就是一张包洋糖的破糖纸吗，有什么好盯着看的？"},{t:"say",who:"灵梦",inner:!1,act:"捏着那张糖纸，盯着看了好一会儿",text:"……刚才在庭上匆匆忙忙的，我还没来得及细想。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"这糖纸上面印着的花纹……是红魔馆那群家伙最喜欢的蝙蝠纹吧。红魔馆的人，大清早为什么要往我的赛钱箱里塞钱和糖呢。"},{t:"fx",label:"演出",text:"画面定格在灵梦手中的蝙蝠纹糖纸上，缓缓黑屏"}]},{key:"4|27|尾声 · 出示其他证物（不扣星，只是没有糖纸那段）|",batch:4,sec:"27",secTitle:"尾声 · 第一被告休息室",h3:"尾声 · 出示其他证物（不扣星，只是没有糖纸那段）",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"盯着手头的记录翻了半天，合上案卷",text:"……算了，大概是我多心了吧。想不起来就算了。"},{t:"say",who:"魔理沙",inner:!1,act:"耸了耸肩",text:"哈哈，也是，反正案子都结咯！走走走，趁着天还早，先陪你去人里把那包高级仙贝的账给平了！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……说了别再提仙贝的事。"},{t:"fx",label:"演出",text:"画面缓缓黑屏"}]},{key:"4|27|尾声 · 字幕|",batch:4,sec:"27",secTitle:"尾声 · 第一被告休息室",h3:"尾声 · 字幕",h4:"",lines:[{t:"fx",label:"字幕",text:"第一案《逆转的九号》· 完"}]},{key:"5|01||",batch:5,sec:"01",secTitle:"出示御币 · 询问① 琪露诺",h3:"",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"亮出御币，冷冷一晃",text:"琪露诺，看清楚我手里拿的是什么。"},{t:"say",who:"琪露诺",inner:!1,act:"两眼放光，当场摆出弹幕架势",text:"哇！是灵梦的御币！终于认可最强的我的实力，要跟咱在公堂上大战三百回合了吗！放马过来啦！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……我只是让你老实交代问题。顺便，开光护符十枚铜钱一张，买不买。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"公堂之上，严禁私相约斗，更不得强买强卖。博丽灵梦，你的善行扣除一星。"}]},{key:"5|02||",batch:5,sec:"02",secTitle:"出示御币 · 询问② 琪露诺",h3:"",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"面无表情地举起御币",text:"……还不说实话是吧。"},{t:"say",who:"琪露诺",inner:!1,act:"条件反射往后缩了半步，又涨红了脸硬挺起胸",text:"哼、哼！少拿那根破棍子吓唬人啦！最强的我才不怕被退治呢！刚才往后退那半步是……是助跑前的热身运动嘛！"},{t:"say",who:"魔理沙",inner:!1,act:"憋笑",text:"助跑哪有往后退的，你这分明是被灵梦平时敲出心理阴影了吧！"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"辩方不得以退治法器威吓证人。博丽灵梦，你的善行扣除一星。"}]},{key:"5|03||",batch:5,sec:"03",secTitle:"出示御币 · 询问③ 露米娅",h3:"",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"把御币伸到证人席前",text:"露米娅，看看这个。"},{t:"say",who:"露米娅",inner:!1,act:"保持双臂平伸，凑过来使劲闻了闻",text:"唔～白白的纸条晃来晃去的，闻起来没有肉味呢～这个也是可以吃的东西吗～？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"不能吃。把口水收回去，要是敢咬破一张纸垂，你就得赔我五十枚铜钱。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"……请勿拿随身法器逗弄证人。博丽灵梦，你的善行扣除一星。"}]},{key:"5|04||",batch:5,sec:"04",secTitle:"出示御币 · 询问④ 露米娅",h3:"",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"拎起御币，轻轻敲了敲手心",text:"露米娅，这根东西你应该很眼熟吧。"},{t:"say",who:"露米娅",inner:!1,act:"平伸的双臂一抖，慢吞吞往后飘了半步",text:"唔～我认得哦～巫女手里那根挂白纸的棍子，每次敲在脑袋上都好痛好痛的～"},{t:"say",who:"魔理沙",inner:!1,act:"半月眼小声嘀咕",text:"……听这熟练的语气，平时没少在黑球里挨灵梦的闷棍啊。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"辩方，传唤证人上庭是为了查明实情，不是让你重温平日的退治手感。博丽灵梦，你的善行扣除一星。"}]},{key:"5|05||",batch:5,sec:"05",secTitle:'出示御币 · 映姬问"可有凭据"时',h3:"",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"把御币往桌上一拍",text:"凭据？我这根维护幻想乡和平的博丽御币，还有巫女的直觉，不就是铁打的凭据吗。"},{t:"say",who:"魔理沙",inner:!1,act:"扶额",text:"喂，你这套土匪逻辑平时在神社门口欺负小妖怪还行，在阎魔面前可混不过去！"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"本庭重申，直觉不是证据，你的御币更不是。博丽灵梦，你的善行扣除一星。"}]},{key:"5|06||",batch:5,sec:"06",secTitle:"出示御币 · 推演空位",h3:"",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"递出御币",text:"拿去。把这个塞进炉子里试试。"},{t:"say",who:"魔理沙",inner:!1,act:"吓得一把按住她的手",text:"喂喂喂！你疯了吗！我这八卦炉里烧的可是真火，把你的御币塞进去，上面的纸垂当场就得烧成灰咯！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……烧坏了正好算你损坏神社公物，照价赔偿。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"推演之时，莫要借机讹诈搭档。推演失当，博丽灵梦，你的善行扣除一星。"}]},{key:"5|07||",batch:5,sec:"07",secTitle:"出示御币 · 终局",h3:"",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"高高举起御币",text:"事到如今，也不用讲什么道理了。直接用这根御币物理结案吧。"},{t:"say",who:"文",inner:!1,act:"眼睛一亮，举起相机连按快门",text:"咔嚓、咔嚓！哎呀呀，博丽巫女理屈词穷，当庭挥舞御币企图武力掀桌——明天头版头条的配图有了呢！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……把底片交出来，不然连你的相机一起超度。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"射命丸文，庭上不得擅自拍照；博丽灵梦，更不得当庭动武。你的善行扣除一星。"}]},{key:"6|01||",batch:6,sec:"01",secTitle:"证言说完一轮 · 询问① 琪露诺「最强的自白」",h3:"",h4:"",lines:[{t:"say",who:"映姬",inner:!1,act:"",text:"被告的陈述到此为止。辩方，可还有要问的。"},{t:"say",who:"魔理沙",inner:!1,act:"凑到灵梦耳边",text:"一圈听下来了。要是还没抓着把柄，就再从头问一遍，拿手边的证物一句句对过去！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……嗯。从第一句再听一遍吧。"}]},{key:"6|02||",batch:6,sec:"02",secTitle:"证言说完一轮 · 询问② 琪露诺「先冻后踢」",h3:"",h4:"",lines:[{t:"say",who:"琪露诺",inner:!1,act:"叉腰仰头",text:"说完啦！最强的我这回一个字都没讲错，哼！"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩方，继续询问。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……破绽肯定还在里面。再从头过一遍。"}]},{key:"6|03||",batch:6,sec:"03",secTitle:"证言说完一轮 · 询问② 看破",h3:"",h4:"",lines:[{t:"say",who:"灵梦",inner:!0,act:"",text:"……一圈听完了。刚才那几句里，她真正心虚的到底是哪一句。再从头盯一遍。"}]},{key:"6|04||",batch:6,sec:"04",secTitle:"证言说完一轮 · 询问③ 露米娅「我看得清清楚楚～」",h3:"",h4:"",lines:[{t:"say",who:"露米娅",inner:!1,act:"双臂平伸，轻轻晃了晃",text:"已经全部说完了哦～就是这样的～"},{t:"say",who:"文",inner:!1,act:"摇扇轻笑",text:"条理分明，可挑不出半点毛病呢。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……真的挑不出毛病吗。从头再听一遍。"}]},{key:"6|05||",batch:6,sec:"05",secTitle:"证言说完一轮 · 询问④ 露米娅「黑漆漆的早上」",h3:"",h4:"",lines:[{t:"say",who:"露米娅",inner:!1,act:"歪头眨眼",text:"唔……我都说完了哦～"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩方，询问继续。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……漏了哪里吗。再从头来一遍。"}]},{key:"6|06||",batch:6,sec:"06",secTitle:"证言说完一轮 · 询问④ 改口之后（卡关段）",h3:"",h4:"",lines:[{t:"say",who:"露米娅",inner:!1,act:"垂着手臂小声说",text:"这下真的全部说完了呀～"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩方，可还有要问的。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……把她的话再从头捋一遍。"}]},{key:"7|01|第一版|",batch:7,sec:"01",secTitle:"出示错误 · 询问① 琪露诺「最强的自白」",h3:"第一版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"琪露诺，睁大眼睛看清楚了——「{证物}」。"},{t:"say",who:"琪露诺",inner:!1,act:"歪着脑袋盯了半天",text:"……哈？这玩意儿跟最强的我有什么关系啦？"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……老实说，拿出来的一瞬间我自己也忘了有什么关系。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"所示之物与被告此句供述并无矛盾。博丽灵梦，你的善行扣除一星。"}]},{key:"7|01|第二版|",batch:7,sec:"01",secTitle:"出示错误 · 询问① 琪露诺「最强的自白」",h3:"第二版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"慢着。你刚才那句话，和「{证物}」完全对不上吧。"},{t:"say",who:"魔理沙",inner:!1,act:"小声凑过来",text:"……喂，灵梦，我怎么没看出来哪儿对不上？"},{t:"say",who:"灵梦",inner:!1,act:"小声",text:"……气势上对不上。先诈她一下试试。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"本庭断案只论实据，不论气势，更不许当庭诈人。博丽灵梦，你的善行扣除一星。"}]},{key:"7|01|第三版|",batch:7,sec:"01",secTitle:"出示错误 · 询问① 琪露诺「最强的自白」",h3:"第三版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"……看好了，这就是能推翻你证言的铁证。"},{t:"say",who:"文",inner:!1,act:"摇扇轻笑",text:"哎呀呀，要是拿这种毫不相干的东西都能定案，本记者明天的头版就该写《博丽巫女在公堂上闭着眼乱翻案卷》了呢！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……你敢写我就敢去拆你的报社。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"辩方所示之物与证言毫无瓜葛。博丽灵梦，你的善行扣除一星。"}]},{key:"7|02|第一版|",batch:7,sec:"02",secTitle:"出示错误 · 询问② 琪露诺「先冻后踢」",h3:"第一版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"琪露诺，「{证物}」都摆在眼前了，你还想嘴硬吗。"},{t:"say",who:"琪露诺",inner:!1,act:"双手叉腰，理直气壮",text:"谁嘴硬了啦！最强的我从来只说大实话！……刚改过来的那种大实话，哼！"},{t:"say",who:"魔理沙",inner:!1,act:"半月眼",text:"把现编的词儿叫大实话，这脸皮比她冻出来的冰还厚咯。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"被告之言暂且不论，辩方所示之物与本句证言确无冲突。博丽灵梦，你的善行扣除一星。"}]},{key:"7|02|第二版|",batch:7,sec:"02",secTitle:"出示错误 · 询问② 琪露诺「先冻后踢」",h3:"第二版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"「{证物}」……已经足以说明一切了。"},{t:"say",who:"魔理沙",inner:!1,act:"探头小声问",text:"嚯，说明了什么？快给我透个底！"},{t:"say",who:"灵梦",inner:!1,act:"面无表情地收回手",text:"……说明我刚才拿错东西了，得换一件。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"既知拿错，何必当庭晃这一遭。博丽灵梦，你的善行扣除一星。"}]},{key:"7|02|第三版|",batch:7,sec:"02",secTitle:"出示错误 · 询问② 琪露诺「先冻后踢」",h3:"第三版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"慢着。接招吧，琪露诺。"},{t:"say",who:"琪露诺",inner:!1,act:"两眼放光，摆出接球架势",text:"哇！终于要用证物当弹幕砸过来了吗！来吧来吧，最强的我全都接得住啦！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……谁要拿案卷跟你打弹幕战了。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"公堂之上严禁投掷证物，且此物与证言毫无矛盾。博丽灵梦，你的善行扣除一星。"}]},{key:"7|03|第一版|",batch:7,sec:"03",secTitle:"出示错误 · 询问③ 露米娅「我看得清清楚楚～」",h3:"第一版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"露米娅，你仔细看看这个——「{证物}」。"},{t:"say",who:"露米娅",inner:!1,act:"保持双臂平伸，凑过来闻了闻",text:"唔～闻起来一点都不香呢，这个不能吃吧～？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……公堂上的东西没有一件是能吃的。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"此物既不可食，亦与证人此句证言毫无矛盾。博丽灵梦，你的善行扣除一星。"}]},{key:"7|03|第二版|",batch:7,sec:"03",secTitle:"出示错误 · 询问③ 露米娅「我看得清清楚楚～」",h3:"第二版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"这个，和你刚才说的根本对不上吧。"},{t:"say",who:"露米娅",inner:!1,act:"无辜地歪了歪头",text:"咦，是这样吗～？哪里对不上呀～？"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……被她用这种软绵绵的眼神一反问，我自己都找不出理由了。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"辩护人自己都底气不足，本庭更无从采信。博丽灵梦，你的善行扣除一星。"}]},{key:"7|03|第三版|",batch:7,sec:"03",secTitle:"出示错误 · 询问③ 露米娅「我看得清清楚楚～」",h3:"第三版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"慢着。看看这个——「{证物}」。"},{t:"say",who:"文",inner:!1,act:"掩嘴轻笑",text:"灵梦小姐，我的目击证人可是看得清清楚楚哦，反倒是您手里的证物，好像找不太准方向呢！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……啧。让这只天狗捡着便宜了。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"所示之物与证言毫无关联。博丽灵梦，你的善行扣除一星。"}]},{key:"7|04|第一版|",batch:7,sec:"04",secTitle:"出示错误 · 询问④ 露米娅「黑漆漆的早上」",h3:"第一版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"露米娅，看清楚我手里的东西。"},{t:"say",who:"露米娅",inner:!1,act:"脑袋往前探了探，眨巴着眼",text:"唔～黑漆漆的，我看不清那是什么哦～"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……现在是大白天，你的黑暗球也早就收起来了，少给我装瞎。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"证人装没装瞎暂且不论，此物与本句证言并无矛盾。博丽灵梦，你的善行扣除一星。"}]},{key:"7|04|第二版|",batch:7,sec:"04",secTitle:"出示错误 · 询问④ 露米娅「黑漆漆的早上」",h3:"第二版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"「{证物}」都在这儿了，这下你还有什么话说。"},{t:"say",who:"露米娅",inner:!1,act:"揉了揉肚子，慢吞吞地歪头",text:"唔……我肚子好饿呀～什么时候才开饭哦～？"},{t:"say",who:"魔理沙",inner:!1,act:"扶额叹气",text:"……完蛋，你的证物在吃货面前半点威慑力都没有咯。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"证人饥饿与否同本案无关，辩方所示之物与证言亦无关。博丽灵梦，你的善行扣除一星。"}]},{key:"7|04|第三版|",batch:7,sec:"04",secTitle:"出示错误 · 询问④ 露米娅「黑漆漆的早上」",h3:"第三版",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示",text:"……能戳破你谎话的，就是这个。"},{t:"say",who:"文",inner:!1,act:"摇扇微笑",text:'哎呀呀，看来灵梦小姐也被绕进那场"黑漆漆的早上"里，开始摸黑乱抓证物了呢！'},{t:"say",who:"灵梦",inner:!1,act:"",text:"……我只是顺手拿出来晾一晾而已。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"公堂不是给你晾晒案卷的地方。所示之物与证言无关，博丽灵梦，你的善行扣除一星。"}]},{key:"7|05||",batch:7,sec:"05",secTitle:"善行耗尽 · 当庭宣判",h3:"",h4:"",lines:[{t:"say",who:"映姬",inner:!1,act:"合上卷宗，悔悟棒轻轻一顿",text:"……到此为止了。"},{t:"say",who:"映姬",inner:!1,act:"",text:"博丽灵梦，本庭已予你诸多机会，然你屡次言之无据，善行至此已然耗尽，辩方之言再不足以采信。"},{t:"say",who:"映姬",inner:!1,act:"起身，高举悔悟棒",text:"本庭现在对被告琪露诺一案，当庭宣判——"}]},{key:"8|01||",batch:8,sec:"01",secTitle:"看破 · 开放：魔理沙提议",h3:"",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"压低声音，用手肘捅了捅灵梦",text:'喂，灵梦。照片一张张摆出来，她还能现编出"先飞五步"……是不是该动用你在《缘起》里登记的那个看家本事了？'},{t:"say",who:"灵梦",inner:!1,act:"小声",text:'嗯。推理卡住的时候，也该听听直觉怎么说了。虽说阿求特意注明了"直觉不是证据"，但拿来揪她的狐狸尾巴绰绰有余。'},{t:"say",who:"魔理沙",inner:!1,act:"小声坏笑",text:"这小冰精吹起牛来向来理直气壮。可刚才那五句话里，有那么一句她心里明显发虚，说出口时的样子跟别的几句完全不一样——连我在旁边都看出来咯！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……说得最不自然的那一句吗。行，那就把这句话揪出来。"}]},{key:"8|02||",batch:8,sec:"02",secTitle:"看破 · 锁定之后：脑海里回放",h3:"",h4:"",lines:[{t:"fx",label:"画面演出",text:"灵梦微微眯起眼睛，视野边缘泛起红白巫女结界的波纹"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……先顺着她嘴里的说法，把那天早上的经过在脑子里过一遍。"}]},{key:"8|02|漫画格 · 她说的样子|",batch:8,sec:"02",secTitle:"看破 · 锁定之后：脑海里回放",h3:"漫画格 · 她说的样子",h4:"",lines:[{t:"fx",label:"漫画格",text:"S1｜叉腰挺胸｜最强冷气一放，整座神社冻成大冰雕！｜呼——！"},{t:"fx",label:"漫画格",text:"S2｜得意｜从鸟居底下，一路帅气地滑过去！｜嗖——！"},{t:"fx",label:"漫画格",text:"S3｜扬起下巴｜冰面上，留下一道长长的滑痕！｜唰——"},{t:"fx",label:"漫画格",text:"S4｜得意大笑｜滑到破箱子跟前，一脚完美搞定！｜咚！！"},{t:"fx",label:"漫画格",text:"S5｜坏笑｜拍拍手，潇洒地离开神社！｜哼哼～"}]},{key:"8|02|漫画格 · 改画 S5|",batch:8,sec:"02",secTitle:"看破 · 锁定之后：脑海里回放",h3:"漫画格 · 改画 S5",h4:"",lines:[{t:"fx",label:"漫画格",text:"S5｜抱头，冷汗｜吓得冷汗直冒，抱住脑袋扭头就逃……｜呜哇——！！"}]},{key:"8|02|漫画格 · 改画 S1|",batch:8,sec:"02",secTitle:"看破 · 锁定之后：脑海里回放",h3:"漫画格 · 改画 S1",h4:"",lines:[{t:"fx",label:"漫画格",text:"S1｜闭眼，冷汗，抱头｜刚落到鸟居底下，就吓得乱放了一通冷气……｜哇啊——！！"}]},{key:"8|02|漫画格 · 盖章|",batch:8,sec:"02",secTitle:"看破 · 锁定之后：脑海里回放",h3:"漫画格 · 盖章",h4:"",lines:[{t:"fx",label:"盖章",text:"S2｜照片推翻"},{t:"fx",label:"盖章",text:"S3｜照片推翻"}]},{key:"8|02|漫画格 · 改画 S4|",batch:8,sec:"02",secTitle:"看破 · 锁定之后：脑海里回放",h3:"漫画格 · 改画 S4",h4:"",lines:[{t:"fx",label:"漫画格",text:"S4｜无｜……赛钱箱，是在她逃走之后才碎掉的？｜……？"}]},{key:"8|03||",batch:8,sec:"03",secTitle:"看破 · 找出对不上的那一格",h3:"",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"凑过来小声问",text:"喂，你眯着眼睛在脑子里琢磨什么呢？"},{t:"say",who:"灵梦",inner:!1,act:"小声",text:'照她自己吹的，这五格里的"最强的她"，从头到尾都威风八面。可她在证人席上念每一句的时候，脸上又是什么表情。'},{t:"say",who:"魔理沙",inner:!1,act:"小声恍然",text:"哦——把她吹出来的威风样，和她说话时的真表情一格一格对过去。哪一格两边对不上，哪一格肯定就有鬼咯！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……把画面和真表情对不上的那一格找出来。"}]},{key:"8|03|指错漫画格|",batch:8,sec:"03",secTitle:"看破 · 找出对不上的那一格",h3:"指错漫画格",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"小声",text:"……这一格。她念这句的时候，脸色好像不太对。"},{t:"say",who:"魔理沙",inner:!1,act:"小声歪头",text:"有吗？她念这句的时候鼻孔都快朝天了，跟画里那个得意样简直一个模子刻出来的啊。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……也是。再换一格对对看。"}]},{key:"8|03|指对 S5|",batch:8,sec:"03",secTitle:"看破 · 找出对不上的那一格",h3:"指对 S5",h4:"",lines:[{t:"say",who:"灵梦",inner:!0,act:"",text:"……就是这最后一格。"},{t:"say",who:"灵梦",inner:!0,act:"",text:'照她嘴里的说法，这时候她刚刚大功告成、"潇洒地离开神社"，脸上该是一副得意坏笑才对。'},{t:"say",who:"灵梦",inner:!0,act:"",text:"可刚才在证人席上念到这一句的时候——她不仅眼神乱飘，连背后的冰翅膀都在哗哗往下滴水。"},{t:"say",who:"魔理沙",inner:!1,act:"小声",text:"冰之妖精的翅膀开始化水……那不就跟人类紧张的时候狂冒汗一个样吗！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……她那时候为什么会突然冒汗。"}]},{key:"8|04|▶ 选择 1：琪露诺那时候为什么冒汗？|",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 1：琪露诺那时候为什么冒汗？",h4:"",lines:[]},{key:"8|04|▶ 选择 1：琪露诺那时候为什么冒汗？|A 因为太热了",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 1：琪露诺那时候为什么冒汗？",h4:"A 因为太热了",lines:[{t:"say",who:"灵梦",inner:!1,act:"小声",text:"……会不会是那天早上太热，把她热出了一身汗。"},{t:"say",who:"魔理沙",inner:!1,act:"小声憋笑",text:"冰精喊热？她刚把整座神社冻成大冰窖，要热出汗来，除非把她塞进我的八卦炉里烤一烤咯！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……说得也是。排除这一条。"}]},{key:"8|04|▶ 选择 1：琪露诺那时候为什么冒汗？|B 踢赛钱箱踢累了",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 1：琪露诺那时候为什么冒汗？",h4:"B 踢赛钱箱踢累了",lines:[{t:"say",who:"灵梦",inner:!1,act:"小声",text:"……难道是踢那个赛钱箱费了太大力气，累出来的汗。"},{t:"say",who:"魔理沙",inner:!1,act:"小声吐槽",text:"一只木头箱子而已，她自己都吹嘘是一脚搞定了，哪至于累得翅膀化水啊？"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……确实不是累的。再想想。"}]},{key:"8|04|▶ 选择 1：琪露诺那时候为什么冒汗？|C 吓出来的冷汗（正解）",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 1：琪露诺那时候为什么冒汗？",h4:"C 吓出来的冷汗（正解）",lines:[{t:"say",who:"灵梦",inner:!0,act:"",text:"……既不是因为热，也不是因为累。那是吓出来的冷汗。"},{t:"say",who:"灵梦",inner:!0,act:"",text:'她嘴上吹嘘着"潇洒离开"，实际上那一刻，她心里怕得要命。'}]},{key:"8|04|选择 1 之后|",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"选择 1 之后",h4:"",lines:[{t:"say",who:"灵梦",inner:!0,act:"",text:"……既然是被吓出了冷汗，那脑海里的这最后一格，根本不是什么拍拍手潇洒走人——而是吓得抱住脑袋、扭头就逃才对。"},{t:"say",who:"魔理沙",inner:!1,act:"小声",text:"啧，能让这个整天嚷嚷着最强的笨蛋吓成这样……她当时到底在怕什么？"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……是啊。她为什么会吓得扭头逃跑。"}]},{key:"8|04|▶ 选择 2：琪露诺为什么吓得逃跑？|",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 2：琪露诺为什么吓得逃跑？",h4:"",lines:[]},{key:"8|04|▶ 选择 2：琪露诺为什么吓得逃跑？|A 踢碎赛钱箱以后才后怕",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 2：琪露诺为什么吓得逃跑？",h4:"A 踢碎赛钱箱以后才后怕",lines:[{t:"say",who:"灵梦",inner:!1,act:"小声",text:"……会不会是踢碎了赛钱箱，怕我事后找她算账，才吓得跑掉的。"},{t:"say",who:"魔理沙",inner:!1,act:"小声摇头",text:"怎么可能！这笨蛋刚才当着阎魔的面都拍着胸脯抢着认罪，哪有一点怕被秋后算账的样子啊？"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……也对。她怕的绝不是被罚。"}]},{key:"8|04|▶ 选择 2：琪露诺为什么吓得逃跑？|B 看到了让她害怕的东西（正解）",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 2：琪露诺为什么吓得逃跑？",h4:"B 看到了让她害怕的东西（正解）",lines:[{t:"say",who:"灵梦",inner:!0,act:"",text:"……踢碎箱子的罪名，她当着阎魔的面都抢着认。她怕的绝不是被我追究。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"只有一个解释——那天早上，在神社的红雾里，她亲眼看到了什么把她吓破了胆的东西。"}]},{key:"8|04|▶ 选择 2：琪露诺为什么吓得逃跑？|C 忘了关自家的冰窖门",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 2：琪露诺为什么吓得逃跑？",h4:"C 忘了关自家的冰窖门",lines:[{t:"say",who:"灵梦",inner:!1,act:"小声",text:"……难道是放完冷气，突然想起自家的冰窖门没关。"},{t:"say",who:"魔理沙",inner:!1,act:"小声半月眼",text:"她家就住在雾之湖，整片湖都是她的大冰窖，上哪儿找门去？灵梦，你是不是惦记着仙贝饿昏头喽。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……当我没说。正经想吧。"}]},{key:"8|04|选择 2 之后|",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"选择 2 之后",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"小声犯嘀咕",text:"等等啊，灵梦。要是她最后是因为看到了什么吓人的东西才逃跑的，那前面这几格又是怎么回事？"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……回想一下她刚才说过的话。琪露诺真正被吓到的那一刻，应该是在——"}]},{key:"8|04|▶ 选择 3：琪露诺是从哪一刻开始被吓到的？|",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 3：琪露诺是从哪一刻开始被吓到的？",h4:"",lines:[]},{key:"8|04|▶ 选择 3：琪露诺是从哪一刻开始被吓到的？|A 踢碎赛钱箱的时候",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 3：琪露诺是从哪一刻开始被吓到的？",h4:"A 踢碎赛钱箱的时候",lines:[{t:"say",who:"灵梦",inner:!1,act:"小声",text:"……是她滑到拜殿跟前，踢碎赛钱箱的那一刻吧。"},{t:"say",who:"魔理沙",inner:!1,act:"小声摇头",text:"不对吧！第一张照片已经证明她压根没往参道里滑过，哪来的滑到箱子跟前这一幕啊？"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……也是。不是那个时候。"}]},{key:"8|04|▶ 选择 3：琪露诺是从哪一刻开始被吓到的？|B 刚落到鸟居底下的时候（正解）",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 3：琪露诺是从哪一刻开始被吓到的？",h4:"B 刚落到鸟居底下的时候（正解）",lines:[{t:"say",who:"灵梦",inner:!0,act:"",text:"……她嘴上嚷嚷着是专门来找我决斗的，结果屋子没进、人也没喊，刚落在鸟居底下就放出一发全力冷气，紧接着就逃跑了。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"从落地到逃跑，她真正干过的就只有放冷气这一件事。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"所以，她刚落到鸟居底下的那一刻，就已经看见了那个吓人的东西。那一发冷气，根本就是她吓得胡乱放出来的。"}]},{key:"8|04|▶ 选择 3：琪露诺是从哪一刻开始被吓到的？|C 离开神社的半路上",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"▶ 选择 3：琪露诺是从哪一刻开始被吓到的？",h4:"C 离开神社的半路上",lines:[{t:"say",who:"灵梦",inner:!1,act:"小声",text:"……是她干完坏事，离开神社的半路上才看见的吧。"},{t:"say",who:"魔理沙",inner:!1,act:"小声吐槽",text:"要是离开的时候才吓到，那前面她吹的那套滑冰总该是真的吧？可照片上她压根没往参道里滑过咯！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……说得对。吓到她的东西一开始就在神社里。"}]},{key:"8|04|改画 S1 之后|",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"改画 S1 之后",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"小声拍手",text:"对咯！第一格根本不是什么威风凛凛放冷气，而是刚落在鸟居底下就被吓得乱放了一通冷气！"},{t:"say",who:"魔理沙",inner:!1,act:"小声",text:"而且第一张照片早就拆穿了她那套滑冰——中间这两格滑过去的牛皮，直接划掉就完事了！"}]},{key:"8|04|盖章之后|",batch:8,sec:"04",secTitle:"看破 · 推理",h3:"盖章之后",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"小声",text:"……刚落在鸟居底下就被吓得乱放冷气，放完冷气当场就逃跑了。"},{t:"say",who:"灵梦",inner:!1,act:"小声",text:"可是第一轮询问的时候已经查清楚了，碎木头全都散落在冰面上，赛钱箱明明是在结冰之后才碎掉的。"},{t:"say",who:"魔理沙",inner:!1,act:"小声恍然",text:"咦？她放完冰当场就逃了，箱子又是结冰之后才碎的……那这上头有两格的先后顺序，岂不是得调换过来咯？"}]},{key:"8|05|换错|",batch:8,sec:"05",secTitle:"看破 · 调换漫画格",h3:"换错",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"小声歪头",text:"……喂，把这两格换过来，前后就更说不通了啊。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……不对，不是换这两格。"}]},{key:"8|05|换对 S4 和 S5|",batch:8,sec:"05",secTitle:"看破 · 调换漫画格",h3:"换对 S4 和 S5",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"小声",text:"……这样就严丝合缝了。"},{t:"say",who:"灵梦",inner:!1,act:"小声",text:"她在鸟居底下放完冷气当场就吓跑了，赛钱箱则是在她逃走之后才碎掉的——这才是那天早上真正的顺序。"}]},{key:"8|06||",batch:8,sec:"06",secTitle:"看破 · 推理结论",h3:"",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"小声惊叹",text:"她连箱子都没顾上碰就吓得扭头逃跑……那天早上的神社里，到底藏着什么鬼东西？"},{t:"say",who:"灵梦",inner:!1,act:"小声",text:"……想知道她看见了什么，直接当面炸她一句就知道了。"}]},{key:"8|07||",batch:8,sec:"07",secTitle:"看破 · 选错句子（S1–S4）",h3:"",h4:"",lines:[{t:"fx",label:"演出",text:"灵梦微微眯眼，盯住琪露诺。视野里风平浪静，什么都没浮现"},{t:"say",who:"魔理沙",inner:!1,act:"小声",text:"……怎么样，有动静吗？"},{t:"say",who:"灵
