  <text x="6" y="114" font-size="6" fill="#5a2a2a">文的空中自拍</text>`),sn={GOHEI:{id:"GOHEI",kind:"evidence",name:"御币",desc:"博丽灵梦随身带着的御币。博丽巫女的身份证明，走到哪儿都带着。妖怪见了，大多会往后缩半步。"},E0:{id:"E0",kind:"evidence",name:"公堂卷宗",desc:"是非曲直公堂第一号卷宗。案由：博丽神社赛钱箱损毁及香火钱失窃。被害器物：博丽神社的赛钱箱（粉碎）。失窃：箱内香火钱（数目待查）。被告：冰之妖精琪露诺。检察官：射命丸文。辩护人：博丽灵梦。案发：红雾爆发当天清晨。"},Y1:{id:"Y1",kind:"engi",name:"《缘起》·博丽灵梦",desc:"博丽神社的巫女。主要是在空中飞行程度的能力。直觉异常敏锐。本人登记的「看破」：对方说谎心虚时，她会察觉到不对劲。阿求注：只限对方自己知道是假的话。对方真心相信的事，哪怕是错的，她也看不出来。另，直觉不是证据，本公堂不采信。"},Y2:{id:"Y2",kind:"engi",name:"《缘起》·雾雨魔理沙",desc:"魔法森林的普通魔法使。使用魔法程度的能力，以光与热为主，经八卦炉施放。本人登记的「推演」：用八卦炉的光，把她的推理过程放映出来。阿求注：放映的只是她脑子里的推理，不是证据。推错了，放出来的画面也会很荒唐。另，本公堂内禁止开到 Master Spark 档。"},E1:{id:"E1",kind:"evidence",name:"现场照片①·参道全景",desc:"鸟居、晾衣绳、整条参道都被冰封，冰面挂着一层白霜。霜上有一道长滑痕：起点在晾衣绳附近，终点是赛钱箱。",svg:gm},E2:{id:"E2",kind:"evidence",name:"现场照片②·鸟居下特写",desc:"鸟居下的冰最厚。冰下封着琪露诺的脚印。",svg:xm},E3:{id:"E3",kind:"evidence",name:"现场照片③·赛钱箱特写",desc:"箱底冻在薄冰里，完好；碎木散落在冰面上。冰面散落 12 枚铜钱，周围霜上有一大片杂乱的手印。碎木堆里有一块写着洋文的小木牌。",svg:ym},E4:{id:"E4",kind:"evidence",name:"《文文。新闻》号外",desc:'标题：《红雾下的冷血暴行！红魔馆门前的冰之恶魔洗劫博丽神社！》配图是冰封的鸟居。右下角小字："本报记者现场独家拍摄四张"。'},E5:{id:"E5",kind:"evidence",name:"赛钱箱账本",desc:'灵梦提交。那天早上：铜钱三十七枚、洋糖一包、绘马一块（洋文，看不懂）。旁边注着"数了三遍"。'},E6:{id:"E6",kind:"engi",name:"《缘起》·琪露诺",desc:"冰之妖精，具操纵冷气程度的能力。冷气从自身放出，离她越近冻得越厚。其冰极冷，遇湿气片刻就会挂霜。会飞。智力评级⑨。"},E7:{id:"E7",kind:"engi",name:"《缘起》·射命丸文",desc:"鸦天狗，具操纵风程度的能力，拍照时会用风把雾或烟吹开。阿求注：她的照片我核对过几张，拍到的东西都是真的。标题就不好说了。"},E8:{id:"E8",kind:"engi",name:"《缘起》·露米娅",desc:'宵暗的妖怪，具操纵黑暗程度的能力。展开黑暗时，从外面看是一团直径约一人高的黑球。她自己在黑暗里也看不见，常撞到树。白天移动时几乎总是展开黑暗。飞行时总是双臂平伸（本人称"像被钉在十字架上的圣人"）。食量很大。'},E9:{id:"E9",kind:"evidence",name:"文的空中自拍",desc:"文悬在参道上空、比着剪刀手的自拍，大半张都是她自己的脸。背景里能看到冰封的参道和晾衣绳，但缩得太小了，看不清细节。",svg:vm},E10:{id:"E10",kind:"evidence",name:"赛钱箱残骸（实物）",desc:"碎成好几块的赛钱箱。"},E11:{id:"E11",kind:"evidence",name:"露米娅的口袋",desc:"25 枚带牙印的铜钱，和一张印着蝙蝠纹的洋糖纸。"},T1:{id:"T1",kind:"evidence",name:"证言记录·琪露诺的怪物",desc:'琪露诺："黑乎乎一团，长着好多白胳膊，在灵梦的衣服上乱扑腾。"'},"P:灵梦":{id:"P:灵梦",kind:"profile",name:"博丽灵梦",desc:"博丽神社的巫女。本案辩护人，也是受害人。能力登记见《缘起》。"},"P:魔理沙":{i 操纵黑暗程度的能力",危险度:"中",人类友好度:"低",主要活动场所:"不明",能力详述:'**展开黑暗时，从外面看是一团直径约一人高的黑球。她自己在黑暗里也看不见**，常撞到树。**白天移动时几乎总是展开黑暗**。**飞行时总是双臂平伸**（本人称"像被钉在十字架上的圣人"）。食量很大。',阿求注:'若被她问起"你是今天可以吃的人类吗"，只需冷淡回答"不是"即可。她通常都会相信。',本庭登记:"第一庭 · 询问②尾声宣读"},Y3:{id:"Y3",name:"小野塚小町",名号:"三途川的引航人",种族:"死神",能力:"操纵距离程度的能力",危险度:"低",人类友好度:"普通",主要活动场所:"三途川",能力详述:"能将两处之间的物理距离随意缩短或拉长，一步即可跨越数十步之遥。",阿求注:"本庭法警。按《公堂章程》第二条，仅在传唤证人与搬运证物时动用能力，且每次须经四季大人批准、由阿求记录在案。另，本人当值期间多半在柱子后面打盹。",本庭登记:"公堂设立时登记 · 第一庭询问②尾声首次当庭使用"}},Mm={"P:灵梦":{id:"P:灵梦",name:"博丽灵梦",steps:["仗着箱里的铜钱，案发当天一早就去人里赊了仙贝。"],本案中:"辩护人（兼受害人）",简介:"我自己。为了追回失窃的三十七枚铜钱亲自上庭。"},"P:魔理沙":{id:"P:魔理沙",name:"雾雨魔理沙",steps:[],本案中:"辩护席搭档",简介:"住在魔法森林的普通魔法使，纯粹是跑来凑热闹的。"},"P:琪露诺":{id:"P:琪露诺",name:"琪露诺",steps:["开庭前在休息室里上赶着要去认罪。",'当庭认罪；被拆穿顺序后改口说是"先冻后踢"。','招认是被晾衣绳上的"怪物"吓跑，根本没碰过箱子。'],本案中:"被告",简介:'住在雾之湖的笨蛋冰精，整天把"最强"挂在嘴边。'},"P:文":{id:"P:文",name:"射命丸文",steps:['在号外里把琪露诺吹成了"红魔馆门前的冰之恶魔"。',"诱导证人作证，还把拍到现场背景的自拍藏着不交。"],本案中:"检察官",简介:"《文文。新闻》的鸦天狗记者，惹祸的号外就是她写的。"},"P:映姬":{id:"P:映姬",name:"四季映姬",steps:[],本案中:"审判长",简介:"阎魔。按《公堂章程》第一条，只凭当庭证据与证言断案。"},"P:阿求":{id:"P:阿求",name:"稗田阿求",steps:[],本案中:"书记官",简介:"《幻想乡缘起》的编者，负责当庭宣读各人的能力档案。"},"P:小町":{id:"P:小町",name:"小野塚小町",steps:[],本案中:"法警",简介:"三途川的船夫。负责传唤与搬证物，用能力前须经阎魔批准。"},"P:露米娅":{id:"P:露米娅",name:"露米娅",steps:["一口咬定自己躲在树林里看清了琪露诺踢箱子。","目击证词无效；案发时她开着黑暗被裹在我的床单里。","挣脱床单后顺着参道冰面一路滑过去，撞碎了赛钱箱。"],本案中:"证人",简介:"宵暗的妖怪，检方找来的目击证人，平时总是双臂平伸。"}},Sm={GOHEI:{id:"GOHEI",name:"御币",hotspots:[{name:"纸垂",text:"刚换上的新纸垂。待会儿谁要是敢碰坏一点，统统照价赔偿。",updates:!1}],类型:"实物"},E0:{id:"E0",name:"公堂卷宗",hotspots:[{name:"第一行",text:'"被害器物：博丽神社的赛钱箱"……第一行就白纸黑字写着，连瞎蒙都用不着。',updates:!1}],类型:"实物"},E1:{id:"E1",name:"现场照片①·参道全景",hotspots:[{name:"滑痕",text:"白霜上留着长长的一道滑痕，从晾衣绳那一带笔直通向了赛钱箱。",updates:!1},{name:"鸟居",text:"鸟居底下的那五步冰霜干干净净，半点滑过的痕迹都没有。",updates:!1}],类型:"照片",更新后说明:"鸟居、晾衣绳、整条参道都被冰封，冰面挂着一层白霜。霜上有一道长滑痕：起点在晾衣绳附近，终点是赛钱箱。滑痕的起点，正好在那张十字空洞床单（文的自拍背景里那张）的正下方。滑痕是一道宽宽的滑槽，起点那儿的霜面上没有脚印。"},E2:{id:"E2",name:"现场照片②·鸟居下特写",hotspots:[{name:"脚印",text:"最厚的冰层底下封着一对小小的脚印。这是琪露诺放冷气时站的地方。",updates:!1}],类型:"照片"},E3:{id:"E3",name:"现场照片③·赛钱箱特写",hotspots:[{name:"铜钱",text:"散落在冰面最上层的铜钱……一、二……一共只剩十二枚。",updates:!1},{name:"手印",text:"碎木箱周围的白霜上，留着一大片乱七八糟的手印。",updates:!1}],类型:"照片"},E4:{id:"E4",name:"《文文。新闻》号外",hotspots:[{name:"小字",text:'……啧，字印得跟蚊子腿一样。凑近了看，上面写着"本报记者现场独家拍摄四张"。',updates:!0}],类型:"实物",说明:"标题：《红雾下的冷血暴行！红魔馆门前的冰之恶魔洗劫博丽神社！》配图是冰封的鸟居。右下角印着一行小字，太小了看不清。",更新后说明:'标题：《红雾下的冷血暴行！红魔馆门前的冰之恶魔洗劫博丽神社！》配图是冰封的鸟居。右下角小字："本报记者现场独家拍摄四张"。'},E5:{id:"E5",name:"赛钱箱账本",hotspots:[{name:"那一页",text:"每一行后面我都画了三个勾。那天早上我确确实实数了整整三遍，绝不会错。",updates:!1}],类型:"实物"},E9:{id:"E9",name:"文的空中自拍",hotspots:[{name:"脸",text:"……这副臭美的得意表情。在案发现场自拍比剪刀手，这家伙脑子里到底都在想些什么。",updates:!1},{name:"红雾",text:"四周的红雾被她的风推开了好大一圈，雾的边上还打着旋儿。……这天狗为了拍张照，可真舍得下力气。",updates:!1},{name:"床单",text:"……找到了。背景里那张冻成冰壳的大床单，正中间破了个十字形的大洞，冰层是从里往外裂开的，下缘还被扯掉了一条白布。",updates:!0}],类型:"照片",说明:"文悬在参道上空、比着剪刀手的自拍，大半张都是她自己的脸。背景里能看到冰封的参道和晾衣绳，但缩得太小了，看不清细节。",更新后说明:"文悬在参道上空、比着剪刀手的自拍。背景里晾衣绳上那张冻硬的大床单，正中间破了个十字形空洞，冰从里向外裂开，下缘被扯掉了一条白布。"},E10:{id:"E10",name:"赛钱箱残骸（实物）",hotspots:[{name:"箱底",text:"底座那块厚木板倒是完好无损，四周还留着冰块化掉的水印子。",updates:!1},{name:"断口",text:"木板全是从外往里炸裂开的，参差不齐——分明是被什么东西顺着参道猛撞上来的。",updates:!1},{name:"木刺",text:"……找到了。背面破口最深处的这几根木刺上，勾着一撮白色的棉布纤维，里面还缠着几根金色的短头发。",updates:!0}],类型:"实物",说明:"碎成好几块的赛钱箱。箱底还算完整，上半截的木板全炸开了，断口全是木刺。",更新后说明:"碎成好几块的赛钱箱。箱底还算完整，上半截的木板全炸开了。破口最深处的木刺上，挂着白色布纤维和几根金色短发。"},E11:{id:"E11",name:"露米娅的口袋",hotspots:[{name:"铜钱",text:"整整二十五枚铜钱，每一枚上面都被硬生生啃出了两个小牙印。",updates:!1},{name:"糖纸",text:"一张花花绿绿的供品洋糖纸，边角上印着一圈眼熟的小花纹。",updates:!1}],类型:"实物"}},Em={engi:bm,profiles:Mm,evidence:Sm},Rn=Em,vn={},ni=new Set;function hc(n={},t=[]){for(const e of Object.keys(vn))delete vn[e];Object.assign(vn,n),ni.clear(),t.forEach(e=>ni.add(e))}const Yi=n=>!!Rn.engi[n],Ar=n=>Rn.engi[n],mh=n=>{var t;return((t=Rn.evidence[n])==null?void 0:t.hotspots)??[]},Uc=n=>!!Rn.evidence[n],Hu=n=>{var t;return((t=Rn.evidence[n])==null?void 0:t.类型)==="实物"?"object":"flat"};function Gu(n){var i,s;const t=Rn.evidence[n],e=(t==null?void 0:t.说明)||((i=sn[n])==null?void 0:i.desc)||((s=Rn.engi[n])==null?void 0:s.能力详述)||"";return(vn[n]||0)>0&&(t!=null&&t.更新后说明)?t.更新后说明:e}function fc(n){var t;return Rn.profiles[n]?(vn[n]||0)+1<Rn.profiles[n].steps.length:!!((t=Rn.evidence[n])!=null&&t.更新后说明)&&!(vn[n]>0)}function dc(n){vn[n]=(vn[n]||0)+1}function Tm(n){var s;const t=Rn.profiles[n];if(!t)return`<div>${((s=sn[n])==null?void 0:s.desc)??""}</div>`;const e=Math.min(t.steps.length,(vn[n]||0)+1),i=t.steps.slice(0,e);return`<div class="pintro">${t.简介??""}</div>${i.map((a,o)=>`<div class="pstep ${o===e-1&&e>1?"newest":""}">· ${a}</div>`).join("")}`}const Am=n=>{var t;return((t=Rn.profiles[n])==null?void 0:t.本案中)??""},Vu=n=>{var e;const t=Rn.profiles[n];return t?((e=Object.entries(Rn.engi).find(([,i])=>i.name===t.name))==null?void 0:e[0])??"":""},Lm=n=>n.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"),Cm="2026-11-16T15:58:28.956Z",Rm=[{key:"1|01||",batch:1,sec:"01",secTitle:"开场动画 · 红雾拂晓",h3:"",h4:"",lines:[{t:"fx",label:"画面",text:"黑屏；一块绘马、几枚铜钱、一包糖从画面上方慢慢翻转着落下",at:0},{t:"say",who:"旁白",inner:!1,act:"",text:"“因果”的齿轮，总是在不经意间悄然转动。",at:.5},{t:"say",who:"旁白",inner:!1,act:"",text:"无论多么微小的心愿，都会掀起意想不到的风。",at:3.7},{t:"fx",label:"画面",text:"落进赛钱箱底",at:6},{t:"say",who:"旁白",inner:!1,act:"",text:"没人知道，它将把多少人的命运卷入其中……",at:6.9},{t:"fx",label:"画面",text:"一记重音——镜头从箱底拉出、拉远，越过参道和鸟居，红雾翻涌",at:11.56},{t:"fx",label:"画面",text:"长着好几片菱形冰翅的身影落在鸟居下",at:13.3},{t:"say",who:"？？？",inner:!1,act:"小声",text:"哼……区区红雾，才吓不倒最强的我呢！",at:13.6},{t:"say",who:"？？？",inner:!1,act:"小声",text:"等灵梦一出来，咱就找她堂堂正正决斗啦！",at:16.8},{t:"sfx",text:"雾里传来一阵慌乱的扑腾声，看不清是什么",at:19.9},{t:"fx",label:"画面",text:"白光一闪，厚重的寒冰顺着石板路一路冻过去，镜头贴着地面跟着冰层冲到赛钱箱",at:20.72},{t:"sfx",text:'相机快门"咔嚓"，连响四声',at:24.02},{t:"fx",label:"画面",text:"赛钱箱已经成了碎片，碎木和铜钱散在挂满白霜的冰面上",at:26.72},{t:"say",who:"？？？",inner:!1,act:"",text:"你看见冰精踢箱子了吧！",at:28.8},{t:"say",who:"？？？",inner:!1,act:"",text:"是这样吗？",at:31.3},{t:"fx",label:"画面",text:"两个剪影淡进雾里，黑场",at:32.7}]},{key:"1|02||",batch:1,sec:"02",secTitle:"开庭前 · 第一被告休息室",h3:"",h4:"",lines:[{t:"fx",label:"画面",text:"两天后 · 是非曲直公堂 · 第一被告休息室"},{t:"bgm",text:"凝重紧张的备战曲（手里的牌不齐，走一步看一步，像临考前捏着一把汗）"},{t:"say",who:"灵梦",inner:!1,act:"叹气",text:"哈啊……为什么我堂堂博丽巫女，大清早的要坐在这间破屋子里干这种事。"},{t:"say",who:"魔理沙",inner:!1,act:"歪头坏笑",text:"这有什么办法咯！谁让这几天全幻想乡都被那团怪模怪样的红雾盖住了呢。"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"大家都看不清路，到处都在丢东西、打闷棍，妖怪们一口咬定是红魔馆干的，差点就把符卡规则撕了打群架呢！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"所以八云紫那个多管闲事的家伙，就拉着阎魔四季映姬搭了这个什么「是非曲直公堂」。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"说是既然红雾里看不清是谁干的，就干脆把证据摆到台面上讲道理……听着就麻烦死了。"},{t:"say",who:"魔理沙",inner:!1,act:"凑过来",text:"嘴上嫌麻烦，跑得倒是比谁都快！我听说，某人可是第一个冲过来报名当辩护人的？"},{t:"say",who:"灵梦",inner:!1,act:"别过脸",text:"……那能一样吗。公堂审的第一桩案子，可是我们博丽神社的赛钱箱被砸碎、外加巨款失窃的大案。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"要是让真正的犯人跑了，我那三十七枚铜钱找谁要去。"},{t:"say",who:"魔理沙",inner:!1,act:"捂嘴笑",text:"对咯对咯，毕竟某人那天早上刚看到箱子里有钱，还没揣进兜里呢，就先跑去人里的点心铺赊了一大包高级仙贝！"},{t:"say",who:"灵梦",inner:!1,act:"额头冒汗",text:"……吵死了。今天要是抓不到真凶拿回赔偿，点心铺老板明天就要上山拆我的鸟居了。"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"所以你就跑来给嫌疑人做无罪辩护啊？我看看，今天被抓来的倒霉蛋是——"},{t:"say",who:"琪露诺",inner:!1,act:"从椅子上跳起来，叉腰仰头",text:'哼哼哼——！什么倒霉蛋！站在你们面前的，可是报纸上鼎鼎大名的"冰之大恶魔"琪露诺啦！'},{t:"say",who:"灵梦",inner:!1,act:"半月眼",text:"……魔理沙，你看到了吧。这就是我今天最头疼的地方。"},{t:"say",who:"琪露诺",inner:!1,act:"挥舞拳头",text:"灵梦！你少在这儿碍事啦！神社的箱子就是最强的我踢碎的，冰也是最强的我冻的！咱待会儿上庭就要堂堂正正认罪啦！"},{t:"say",who:"魔理沙",inner:!1,act:"愣住",text:"哈？！自己的委托人上赶着要去认罪，这官司还怎么打啊？！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"我怎么知道这笨蛋脑子里装的是什么冰碴子。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"反正我的直觉告诉我，砸碎箱子偷走钱的绝对另有其人。要是让这笨蛋顶了罪被判去彼岸挑水，真凶可就拿着我的铜钱逍遥法外了。"},{t:"sfx",text:"开门声"},{t:"say",who:"小町",inner:!1,act:"探头打哈欠",text:"呼啊——辩护人、被告都在吧？四季大人已经坐稳了，该进场开庭了。"},{t:"say",who:"小町",inner:!1,act:"从怀里摸出一卷纸，随手塞给灵梦",text:"喏，这是今天第一庭的卷宗。四季大人特意嘱咐，让你进场前好歹瞄上一眼呐。"},{t:"fx",label:"演出",text:"证物 E0 公堂卷宗 收入法庭记录"},{t:"say",who:"琪露诺",inner:!1,act:"兴冲冲往外跑",text:"好耶！轮到最强的我上场出风头啦！"},{t:"say",who:"灵梦",inner:!1,act:"顺手抄起桌上的御币",text:"……走吧。"},{t:"say",who:"魔理沙",inner:!1,act:"瞥见她手里的家伙，乐了",text:"哟，上公堂讲道理还拎着御币？知道的当你是去辩护，不知道的还以为你要去当庭退治谁呢！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"少管闲事。巫女出门不带御币，就跟你出门不戴那顶大黑帽子一样，浑身没底气。"},{t:"fx",label:"演出",text:"证物 御币 收入法庭记录"},{t:"say",who:"魔理沙",inner:!1,act:"拍拍灵梦肩膀",text:"行行行，只要别顺手敲在阎魔脑袋上就行。走吧大巫女，祝你保住自家的鸟居咯！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……既要防着对面的大记者，又要按住自家的笨蛋委托人。这辩护费我非得收双倍不可。"}]},{key:"1|03||",batch:1,sec:"03",secTitle:"序幕 · 开庭与三选一考校",h3:"",h4:"",lines:[{t:"fx",label:"画面",text:"是非曲直公堂 · 法庭全景"},{t:"sfx",text:"悔悟棒敲击声"},{t:"say",who:"映姬",inner:!1,act:"端坐",text:"肃静。是非曲直公堂今日首次开庭，审理博丽神社赛钱箱损毁及香火钱失窃一案。"},{t:"say",who:"映姬",inner:!1,act:"",text:"检方与辩方，是否均已准备就绪。"},{t:"say",who:"文",inner:!1,act:"鞠躬微笑",text:"检方射命丸文，随时可以开始哦，阎魔大人！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……辩方博丽灵梦。差不多也行吧。"},{t:"say",who:"映姬",inner:!1,act:"皱眉",text:'"差不多也行"是何种态度。博丽灵梦，鉴于你是首次站上辩护席，且眼神极度涣散——'},{t:"say",who:"映姬",inner:!1,act:"",text:"本庭在正式审理前，须先考校你对本案基本卷宗与公堂规矩的掌握程度。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……我就知道没法轻松混过去。"},{t:"say",who:"魔理沙",inner:!1,act:"小声",text:"加油啊灵梦，这种送分题要是答错了，可是会当场出大丑的！"},{t:"say",who:"魔理沙",inner:!1,act:"压低声音，努了努嘴",text:"对了，小町刚才塞给你的卷宗、还有在场各位的人物资料，全都整整齐齐收在你的「法庭记录」里。"},{t:"say",who:"魔理沙",inner:!1,act:"小声",text:"要是脑袋卡壳答不上来，就赶紧翻开偷看一眼！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……把标准答案全摆在手边了吗。那倒是省得我费脑子背了。"},{t:"say",who:"映姬",inner:!1,act:"",text:'听好第一题。本案之中，惨遭毒手、粉身碎骨的"被害者"，究竟是谁。'}]},{key:'1|03|▶ 选择 1：本案的"被害者"是谁？（选错无惩罚，重选）|',batch:1,sec:"03",secTitle:"序幕 · 开庭与三选一考校",h3:'▶ 选择 1：本案的"被害者"是谁？（选错无惩罚，重选）',h4:"",lines:[]},{key:'1|03|▶ 选择 1：本案的"被害者"是谁？（选错无惩罚，重选）|A 琪露诺',batch:1,sec:"03",secTitle:"序幕 · 开庭与三选一考校",h3:'▶ 选择 1：本案的"被害者"是谁？（选错无惩罚，重选）',h4:"A 琪露诺",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"那还用问吗，当然是站在那儿的笨蛋琪露诺了。"},{t:"say",who:"琪露诺",inner:!1,act:"跳脚",text:"喂！谁粉身碎骨了啦！最强的我还活蹦乱跳地站在这儿呢，哼！"},{t:"say",who:"映姬",inner:!1,act:"摇头",text:"琪露诺乃是本案被告。把被告当成被害者，你连卷宗第一行字都未曾看过吗。重答。"}]},{key:'1|03|▶ 选择 1：本案的"被害者"是谁？（选错无惩罚，重选）|B 我的钱包',batch:1,sec:"03",secTitle:"序幕 · 开庭与三选一考校",h3:'▶ 选择 1：本案的"被害者"是谁？（选错无惩罚，重选）',h4:"B 我的钱包",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"毫无疑问，是我那还没来得及鼓起来的钱包，以及我在人里点心铺的信用。"},{t:"say",who:"魔理沙",inner:!1,act:"扶额",text:"虽然我能理解你的悲痛，但钱包和信用可不会在地上摔成木头片咯！"},{t:"say",who:"映姬",inner:!1,act:"严肃",text:"博丽灵梦，莫要在公堂上哭穷。请回答卷宗上登记的受损器物名称。重答。"}]},{key:'1|03|▶ 选择 1：本案的"被害者"是谁？（选错无惩罚，重选）|C 博丽神社的赛钱箱（正解）',batch:1,sec:"03",secTitle:"序幕 · 开庭与三选一考校",h3:'▶ 选择 1：本案的"被害者"是谁？（选错无惩罚，重选）',h4:"C 博丽神社的赛钱箱（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"……还能是谁。当然是我们博丽神社可怜的赛钱箱了。"},{t:"say",who:"映姬",inner:!1,act:"点头",text:"不错。前日清晨，博丽神社的赛钱箱被毁得粉碎，箱内财物亦不知所踪。"},{t:"say",who:"映姬",inner:!1,act:"",text:"那么继续考校第二题。本庭所立《公堂章程》第一条，明确规定了本庭断案的唯一依据——那是什么。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……阎魔亲自立的规矩，自然得去查阎魔自己的底细。翻开她的人物资料，说不定上面就白纸黑字写着。"}]},{key:"1|03|选择 1 · 第一次选错后的提示|",batch:1,sec:"03",secTitle:"序幕 · 开庭与三选一考校",h3:"选择 1 · 第一次选错后的提示",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"小声戳了戳灵梦",text:"喂喂，别闭着眼睛瞎蒙啊！快翻开「法庭记录」，去「证物」那一栏里翻卷宗——"},{t:"say",who:"魔理沙",inner:!1,act:"手指往斜上方一指，又慌忙收回",text:"就在右上角……啊不是，我是说就在你手边！手边那叠纸！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……这家伙刚才往天上指什么呢。该不会看见了什么不该看见的东西吧。"}]},{key:"1|03|▶ 选择 2：本公堂断案的唯一依据是什么？（选错无惩罚，重选）|",batch:1,sec:"03",secTitle:"序幕 · 开庭与三选一考校",h3:"▶ 选择 2：本公堂断案的唯一依据是什么？（选错无惩罚，重选）",h4:"",lines:[]},{key:"1|03|▶ 选择 2：本公堂断案的唯一依据是什么？（选错无惩罚，重选）|A 谁的弹幕更华丽",batch:1,sec:"03",secTitle:"序幕 · 开庭与三选一考校",h3:"▶ 选择 2：本公堂断案的唯一依据是什么？（选错无惩罚，重选）",h4:"A 谁的弹幕更华丽",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"按幻想乡的老规矩，当然是谁的符卡弹幕更华丽、谁把对方打趴下，谁就占理了。"},{t:"say",who:"文",inner:!1,act:"掩嘴笑",text:"哎呀呀，要是按弹幕算，灵梦小姐岂不是可以在公堂上横着走了吗？"},{t:"say",who:"映姬",inner:!1,act:"敲桌",text:"胡闹。正因为红雾之中弹幕混战不休，本庭与八云紫方才设立此公堂以理服人。重答。"}]},{key:"1|03|▶ 选择 2：本公堂断案的唯一依据是什么？（选错无惩罚，重选）|B 巫女敏锐的直觉",batch:1,sec:"03",secTitle:"序幕 · 开庭与三选一考校",h3:"▶ 选择 2：本公堂断案的唯一依据是什么？（选错无惩罚，重选）",h4:"B 巫女敏锐的直觉",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"我的直觉。只要我一眼看过去觉得谁像犯人，十有八九就是她没跑了。"},{t:"say",who:"魔理沙",inner:!1,act:"吐舌头",text:"喂喂，虽然你平时退治妖怪确实全靠瞎蒙，但在阎魔面前可不能这么说咯！"},{t:"say",who:"映姬",inner:!1,act:"严厉",text:"直觉绝非断案之凭据。博丽灵梦，收起你平日的散漫习气，重答。"}]},{key:"1|03|▶ 选择 2：本公堂断案的唯一依据是什么？（选错无惩罚，重选）|C 当庭出示的证据与证言（正解）",batch:1,sec:"03",secTitle:"序幕 · 开庭与三选一考校",h3:"▶ 选择 2：本公堂断案的唯一依据是什么？（选错无惩罚，重选）",h4:"C 当庭出示的证据与证言（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"……知道了。是非曲直，皆凭实据。只靠当庭摆出来的证据和证言说话，对吧。"},{t:"say",who:"映姬",inner:!1,act:"",text:"然也。本庭不对活人使用净颇梨之镜，唯有铁证方能定夺是非。"},{t:"say",who:"映姬",inner:!1,act:"",text:"若辩方在之后的审理中言之无据、胡乱出示证物，本庭便会扣除你的善行一星。五星扣尽，即判辩方败诉。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……刚才那两题居然没扣我的星，算她还有点良心。"}]},{key:"1|03|选择 2 · 第一次选错后的提示|",batch:1,sec:"03",secTitle:"序幕 · 开庭与三选一考校",h3:"选择 2 · 第一次选错后的提示",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"小声扶额",text:"都说了答不上来就偷看一眼……咳，快打开「法庭记录」切到「人物」那一栏，翻翻四季大人的资料卡！她立的规矩全写在自己名下咯！"}]},{key:"1|04||",batch:1,sec:"04",secTitle:"序幕 · 利益冲突、能力登记、起诉与证物",h3:"",h4:"",lines:[{t:"say",who:"映姬",inner:!1,act:"低头看卷宗",text:"既已明晰规则，下面核对双方身份。本案辩护人，博丽灵梦。本案受害人……博丽灵梦。"},{t:"say",who:"映姬",inner:!1,act:"皱眉",text:"本案检察官，射命丸文。点燃众怒的号外撰稿人……也是射命丸文。"},{t:"say",who:"映姬",inner:!1,act:"拿悔悟棒挡嘴",text:"……受害人亲自担任辩护，闹事记者亲自担任公诉。你们两个都太乱来了。"},{t:"say",who:"文",inner:!1,act:"鞠躬微笑",text:"哎呀呀，阎魔大人此言差矣呢！正因为是本记者采写的新闻，才更要亲自捍卫报道的真实性呀！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"就是说啊。被砸的是我的箱子，丢的是我的钱，我不亲自上庭盯着，还能指望谁？"},{t:"say",who:"映姬",inner:!1,act:"翻看规则书",text:"……咳。鉴于公堂章程初立，第一页尚未禁止此种情况。"},{t:"say",who:"映姬",inner:!1,act:"",text:"本庭当庭补立公堂章程第三条：与案件有利害关系者，可以担任辩护人或检察官，但须当庭申明利害关系。"},{t:"say",who:"文",inner:!1,act:"挺胸",text:"本记者在此申明！前日发行的《文文。新闻》号外，确系小女子一人采写编发哦！"},{t:"say",who:"映姬",inner:!1,act:"",text:"博丽灵梦，轮到你申明了。区区三十七枚铜钱，何至于令你如此急迫？"},{t:"say",who:"灵梦",inner:!1,act:"空手做端茶动作，视线乱飘",text:"……嗯。今天公堂里的空气挺润喉的。"},{t:"say",who:"魔理沙",inner:!1,act:"捅了捅灵梦",text:"别喝空气茶咯！在阎魔面前瞒不住的，快把仙贝的事交代了吧！"},{t:"say",who:"灵梦",inner:!1,act:"冒汗",text:"……哈啊。好吧，我申明。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"那天一大早我发现赛钱箱里有笔巨款，就仗着这笔马上到手的钱，下山去人里的点心铺赊了高级仙贝。"},{t:"say",who:"映姬",inner:!1,act:"摇头",text:"钱未落袋便先行举债，不知节制。利害关系申明完毕，记录在案。"},{t:"say",who:"映姬",inner:!1,act:"",text:"此外，依据公堂章程第二条，凡在庭上动用能力者，须由书记官稗田阿求先行宣读《幻想乡缘起》备案。"},{t:"say",who:"阿求",inner:!1,act:"翻开卷宗",text:"是，四季大人。阿求这便宣读辩方二人的能力备案。"},{t:"say",who:"阿求",inner:!1,act:"档案腔",text:"博丽灵梦，博丽神社的巫女。主要是在空中飞行程度的能力。"},{t:"say",who:"阿求",inner:!1,act:"",text:"直觉异常敏锐。本人登记的「看破」：对方说谎心虚时，她会察觉到不对劲。"},{t:"say",who:"阿求",inner:!1,act:"翻页",text:"阿求注：只限对方自己知道是假的话。对方真心相信的事，哪怕是错的，她也看不出来。另，直觉不是证据，本公堂不采信。"},{t:"say",who:"阿求",inner:!1,act:"档案腔",text:"雾雨魔理沙，魔法森林的普通魔法使。使用魔法程度的能力，以光与热为主，经八卦炉施放。"},{t:"say",who:"阿求",inner:!1,act:"",text:"本人登记的「推演」：用八卦炉的光，把她的推理过程放映出来。"},{t:"say",who:"阿求",inner:!1,act:"翻页",text:"阿求注：放映的只是她脑子里的推理，不是证据。推错了，放出来的画面也会很荒唐。另，本公堂内禁止开到 Master Spark 档。"},{t:"say",who:"魔理沙",inner:!1,act:"压帽檐",text:"啧，连火力档位都给限制得死死的，阿求你写得可真够细的！"},{t:"say",who:"阿求",inner:!1,act:"合上书页，温和微笑",text:"两位的备案均已正式录入《幻想乡缘起》。庭审之中若遇各路能力交锋，随时可以翻阅查考哦。"},{t:"say",who:"魔理沙",inner:!1,act:"凑到灵梦耳边小声说",text:"瞧见没，阿求那本《缘起》往后就摆在你手边了！在场谁有什么看家本事、又有什么要命的短处，翻一翻就能摸个底儿掉！"},{t:"fx",label:"演出",text:"《缘起》Y1 博丽灵梦、Y2 雾雨魔理沙 收入《缘起》"},{t:"say",who:"映姬",inner:!1,act:"",text:"备案完毕。检方射命丸文，请宣读起诉状与求刑，并呈交物证。"},{t:"say",who:"文",inner:!1,act:"一扬团扇",text:"是！检方指控被告——冰之妖精琪露诺，于前日清晨潜入博丽神社，恶意踢碎赛钱箱并劫走香火钱！"},{t:"say",who:"文",inner:!1,act:"微笑",text:"鉴于其犯罪气焰极其嚣张，检方请求判处被告——罚往彼岸三途川挑水五十年呢！"},{t:"say",who:"文",inner:!1,act:"举起相机",text:"至于物证，请看本记者在案发当日清晨六点五十分拍下的三张现场铁证，以及本报的号外哦！"},{t:"fx",label:"演出",text:"证物 E1 现场照片①·参道全景、E2 现场照片②·鸟居下特写、E3 现场照片③·赛钱箱特写、E4《文文。新闻》号外 收入法庭记录"},{t:"say",who:"魔理沙",inner:!1,act:"探头看照片",text:"嚯，那天早上红雾浓得伸手不见五指，你这照片怎么拍得跟大晴天一样清楚？"},{t:"say",who:"文",inner:!1,act:"挺胸得意",text:"红雾里也能拍得这么清楚，全靠本记者用风把雾吹开了呀！"},{t:"say",who:"文",inner:!1,act:"",text:"而且为了绝对不破坏现场痕迹，本记者可是全程悬停在半空中取景，连半只脚都没踩上冰面哦！"},{t:"say",who:"阿求",inner:!1,act:"递上一页抄本",text:"补充检方能力档案。《幻想乡缘起》记载：鸦天狗射命丸文，具操纵风程度的能力，拍照时会用风把雾或烟吹开。"},{t:"say",who:"阿求",inner:!1,act:"",text:"阿求注：她的照片我核对过几张，拍到的东西都是真的。标题就不好说了。"},{t:"say",who:"文",inner:!1,act:"僵笑",text:"阿、阿求小姐，最后那句批注就不必当庭念出来了吧！"},{t:"say",who:"灵梦",inner:!1,act:"盯着照片③ E3",text:"……那块洋文木牌也在碎木头里。那天早上数钱的时候我就想说了，谁会把绘马塞进赛钱箱啊。"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"管它呢，八成是哪个不懂规矩的香客塞进去的吧。"},{t:"say",who:"灵梦",inner:!1,act:"拿出账本",text:"比起那个，这是我那天早上的赛钱箱账本。里面清清楚楚记着铜钱三十七枚、洋糖一包。"},{t:"fx",label:"演出",text:"证物 E5 赛钱箱账本 收入法庭记录"},{t:"say",who:"文",inner:!1,act:"歪头",text:"哦？灵梦小姐既然在案发前打开过箱子，为什么不把钱收进屋里，反而留在箱子里等贼偷呢？"},{t:"say",who:"灵梦",inner:!1,act:"别过脸",text:"……我那天早上数了整整三遍。难得有这么一笔巨款，当然要放回箱子里，等魔理沙过来的时候再当面打开给她显摆一下啊。"},{t:"say",who:"魔理沙",inner:!1,act:"半月眼",text:"……搞了半天，你是为了向我炫耀才把钱留在外面的咯？！"},{t:"say",who:"阿求",inner:!1,act:"递上一页抄本",text:"最后呈交被告能力档案。《幻想乡缘起》记载：冰之妖精琪露诺，具操纵冷气程度的能力。冷气从自身放出，离她越近冻得越厚。"},{t:"say",who:"阿求",inner:!1,act:"",text:"其冰极冷，遇湿气片刻就会挂霜；会飞；智力评级为⑨。"},{t:"fx",label:"演出",text:"证物 E6《缘起》·琪露诺、E7《缘起》·射命丸文 收入法庭记录"},{t:"say",who:"映姬",inner:!1,act:"",text:"证物核验完毕。传被告琪露诺上庭陈述。"},{t:"say",who:"琪露诺",inner:!1,act:"叉腰跳上证人席",text:'哼哼哼——！不用审啦！报纸上写的那个洗劫神社的"冰之大恶魔"，就是最强的我啦！'}]},{key:"1|05||",batch:1,sec:"05",secTitle:"询问① · 证言「最强的自白」",h3:"",h4:"",lines:[{t:"stmt",id:"S1",who:"琪露诺",act:"叉腰仰头",text:"那天一大早，最强的我就飞到神社来了！"},{t:"stmt",id:"S2",who:"琪露诺",act:"挥拳",text:'看到那个破木箱子，最强的我"咚"地一脚就把它踢得稀巴烂！'},{t:"stmt",id:"S3",who:"琪露诺",act:"张开双臂",text:'最强的我还"呼——"地放出最强冷气，把整个神社冻成了大冰雕！'},{t:"stmt",id:"S4",who:"琪露诺",act:"得意大笑",text:"又碎又冻，除了最强的我谁做得到啦！"}]},{key:"1|06||",batch:1,sec:"06",secTitle:"证言完毕 → 询问前的过渡",h3:"",h4:"",lines:[{t:"say",who:"映姬",inner:!1,act:"点头",text:"被告当庭认罪，所述经过与现场冰封之状亦无表面出入。"},{t:"say",who:"映姬",inner:!1,act:"举起悔悟棒",text:"然本庭断案，绝不偏听单方之词。依公堂规矩，须经辩方逐句询问核实，方可采信。"},{t:"say",who:"文",inner:!1,act:"摇扇轻笑",text:"连犯人自己都拍着胸脯认下了，还要走询问流程呀？阎魔大人可真是滴水不漏呢！"},{t:"say",who:"魔理沙",inner:!1,act:"凑到灵梦耳边",text:"喂，灵梦，这小冰精刚才那四句话，我怎么听怎么觉得怪怪的！"},{t:"say",who:"灵梦",inner:!1,act:"",text:'是啊。满嘴都是"最强的我"，一听就是在硬撑面子吹牛皮。'},{t:"say",who:"魔理沙",inner:!1,act:"指了指桌上的卷宗",text:"既然觉得她在吹牛，那就先一句句【追问】她，把她话里的细节撬出来！"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"要是发现她哪句话和我们手里的【证物】对不上，就直接把证物甩到她脸上【指证】她！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"用证据拆穿自家委托人的牛皮吗……行吧，为了我的三十七枚铜钱，开工了。"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩方，请开始你的询问。"}]},{key:"1|07|追问 S1|",batch:1,sec:"07",secTitle:"询问① · 追问与指证",h3:"追问 S1",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"……你平时不是一直待在雾之湖那边吗。大清早跑我神社来干什么。"},{t:"say",who:"琪露诺",inner:!1,act:"缩了下脖子，马上挺胸",text:"那、那天早上湖那边突然冒出好多奇怪的红雾！咱、最强的我才不是逃过来的！是专门来找灵梦决斗的啦！"},{t:"say",who:"魔理沙",inner:!1,act:"抱臂坏笑",text:"哦？找灵梦决斗，结果不敲门也不喊人，光顾着跟门口的木箱子过不去？"},{t:"say",who:"琪露诺",inner:!1,act:"跺脚",text:"吵死了！那是决斗前的热身运动嘛！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……从雾之湖一路被红雾吓得逃上山，连句像样的借口都编不出来。"}]},{key:"1|07|追问 S2|",batch:1,sec:"07",secTitle:"询问① · 追问与指证",h3:"追问 S2",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"你说你一脚踢碎了赛钱箱。那我问你，箱子里的钱呢。"},{t:"say",who:"琪露诺",inner:!1,act:"眨眼愣住",text:"哈？钱？……什么钱？"},{t:"say",who:"文",inner:!1,act:"摇扇微笑",text:"灵梦小姐，劫匪怎么会主动交代赃款藏在哪儿呢？"},{t:"say",who:"琪露诺",inner:!1,act:"恍然大悟，连连点头",text:"对、对啦！最强的我把钱全藏进秘密基地了，才不告诉你呢，哼！"},{t:"say",who:"灵梦",inner:!0,act:"",text:'……她刚才那声"什么钱"，是真不知道箱子里有钱。'}]},{key:"1|07|追问 S3|",batch:1,sec:"07",secTitle:"询问① · 追问与指证",h3:"追问 S3",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"只是踢坏个箱子，你为什么还要放冷气把整个院子都冻上。"},{t:"say",who:"琪露诺",inner:!1,act:"鼻孔朝天",text:"哼哼！白花花的一大片，冻成大冰雕可漂亮了啦！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……把我晾在院子里的巫女服和床单全冻成硬邦邦的冰块，这也叫漂亮吗。"},{t:"say",who:"映姬",inner:!1,act:"严肃",text:"博丽灵梦，关于你把晾衣绳拴在鸟居上一事，本庭稍后再与你清算。请继续询问证言本身。"},{t:"say",who:"灵梦",inner:!1,act:"空手喝茶",text:"……嗯。请证人继续往下说吧。"}]},{key:"1|07|追问 S4|",batch:1,sec:"07",secTitle:"询问① · 追问与指证",h3:"追问 S4",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:'"又碎又冻"。你倒是说得轻巧，这两样到底是怎么干的。'},{t:"say",who:"琪露诺",inner:!1,act:"拍胸脯",text:'那还用说！先"咚"地一脚把箱子踢碎，再"呼——"地一口冷气冻住，一气呵成！最强的我记性也是最强的，顺序半点都没错啦！'},{t:"say",who:"映姬",inner:!1,act:"",text:"被告方才所言之先后，书记官，补入证言。"},{t:"say",who:"阿求",inner:!1,act:"提笔",text:"是，已补入第五句证言。"},{t:"sys",text:"证言追加 S5"},{t:"say",who:"魔理沙",inner:!1,act:"小声",text:"瞧见没，灵梦？追问撬出来的新说法也会记进证言里，照样能拿证物砸过去！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……这笨蛋，随便激一句就把话给说死了。"},{t:"stmt",id:"S5",who:"琪露诺",act:"竖起两根手指",text:'先"咚"地踢碎，再"呼——"地冻住！顺序半点都没错啦！'}]},{key:"1|07|追问 S5|",batch:1,sec:"07",secTitle:"询问① · 追问与指证",h3:"追问 S5",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"……你确定是这个顺序，不改口了。"},{t:"say",who:"琪露诺",inner:!1,act:"叉腰",text:"确定确定！最强的我说一不二，改口那叫缩头乌龟啦！"}]},{key:"1|07|S5 出现之前，在 S2 或 S3 出示 E3（不扣星）|",batch:1,sec:"07",secTitle:"询问① · 追问与指证",h3:"S5 出现之前，在 S2 或 S3 出示 E3（不扣星）",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示 E3",text:"看这张赛钱箱特写——"},{t:"say",who:"琪露诺",inner:!1,act:"歪头",text:"箱子碎了，地上冻了，跟最强的我说的一模一样嘛！"},{t:"say",who:"映姬",inner:!1,act:"",text:"被告方才只道又踢又冻，尚未言明孰先孰后。辩方，先问清次序，再行指证。本次不扣善行。"}]},{key:"1|07|错误出示 E4《文文。新闻》号外|",batch:1,sec:"07",secTitle:"询问① · 追问与指证",h3:"错误出示 E4《文文。新闻》号外",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"看清楚了，这张报纸上写的可是——"},{t:"say",who:"琪露诺",inner:!1,act:"两眼放光，凑上前",text:'哇！快念快念！是不是写着"史上最强的冰之大恶魔琪露诺"啦！'},{t:"say",who:"文",inner:!1,act:"掩嘴笑",text:"多谢琪露诺小姐捧场呢！虽然辩方好像是在帮本记者宣传报纸就是了哦！"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"博丽灵梦，切勿在庭上替检方的报纸做宣传。言之无据，你的善行扣除一星。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……哈啊。拿那份满纸吹牛的号外出来干什么，我也是昏了头了。"}]},{key:"1|07|错误出示 E5 赛钱箱账本|",batch:1,sec:"07",secTitle:"询问① · 追问与指证",h3:"错误出示 E5 赛钱箱账本",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"这个账本上记着三十七枚铜钱，跟你的证言矛盾。"},{t:"say",who:"琪露诺",inner:!1,act:"掰着手指算",text:"三、三十七？一、二、九……哼！不管多少枚，反正全被最强的我一脚踢飞啦！"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"账本仅能证明箱内原有财物数目，无法直接推翻被告所述的作案手法。辩方，你的善行扣除一星。"},{t:"say",who:"魔理沙",inner:!1,act:"小声",text:"喂，灵梦，查账的事待会儿再说，先盯着她的证言问清楚吧！"}]},{key:"1|07|错误出示 E6《缘起》·琪露诺|",batch:1,sec:"07",secTitle:"询问① · 追问与指证",h3:"错误出示 E6《缘起》·琪露诺",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"你的能力档案上写得很清楚——"},{t:"say",who:"琪露诺",inner:!1,act:"兴奋跳起",text:"哇！是咱的档案！你们快看最后一行，智力评级那一栏写着⑨呢！是最大的数字，最高分啦！"},{t:"say",who:"阿求",inner:!1,act:"温和微笑",text:"琪露诺小姐，阿求不得不提醒一句，在《幻想乡缘起》的评级里，⑨并不是最高分的意思哦。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"被告确有冰封神社之能力，此档案反而印证了其证词。博丽灵梦，你的善行扣除一星。"}]},{key:"1|07|指证 S5 × E3 现场照片③·赛钱箱特写 · 正解（S5 补入之后，S2、S3 也算对）|",batch:1,sec:"07",secTitle:"询问① · 追问与指证",h3:"指证 S5 × E3 现场照片③·赛钱箱特写 · 正解（S5 补入之后，S2、S3 也算对）",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"指证",text:"慢着。琪露诺，你的牛皮吹反了。"},{t:"say",who:"琪露诺",inner:!1,act:"愣住",text:"哈？最强的我哪里说反了啦！"},{t:"say",who:"灵梦",inner:!1,act:"出示 E3",text:"自己看射命丸文拍的第三张照片。赛钱箱的底座，现在是什么状态。"},{t:"say",who:"琪露诺",inner:!1,act:"凑近看图",text:"底座？底座冻在冰里面呀，怎么了嘛？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"底座完好无损地冻在冰里，而碎掉的木头片，却全都散落在冰面的最上层。"},{t:"say",who:"魔理沙",inner:!1,act:"一拍手",text:"对咯！要是真像你说的，先一脚把箱子踢碎、再放冷气冻上，那碎木片应该全被封在冰块里面才对！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"碎木头在冰面上，说明赛钱箱碎掉的时候，地面早就已经结冰了。也就是说——根本不是先踢后冻，而是先有了冰，箱子才碎的。"},{t:"say",who:"琪露诺",inner:!1,act:"抱头卡壳",text:"呃？！先、先有冰，后有木头……不对，先有木头，后有冰……哇啊啊咱的脑子要打结了啦！"},{t:"say",who:"文",inner:!1,act:"啪地合上团扇，微笑",text:"哎呀呀，灵梦小姐推理得真精彩呢！不过，这又能证明什么呢？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……什么意思。"},{t:"say",who:"文",inner:!1,act:"从容走前一步",text:"众所周知，这位妖精小姐的智力评级可是⑨哦！笨蛋妖精一时糊涂，把先后顺序记反了而已。"},{t:"say",who:"文",inner:!1,act:"",text:'实际上她是"先冻住了神社，再走过去一脚踢碎了箱子"——结论完全不变呢！'},{t:"say",who:"琪露诺",inner:!1,act:"如蒙大赦，疯狂点头",text:"对对对！就是写报纸的说的那样！最强的我是先冻再踢的啦！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……啧。被这只狡猾的天狗顺水推舟圆过去了。"},{t:"say",who:"映姬",inner:!1,act:"",text:'检方所言不无道理。本庭准许被告修正证词，就"先冻后踢"一事重新陈述。'},{t:"fx",label:"演出",text:"人物档案 琪露诺 更新"}]},{key:"2|08||",batch:2,sec:"08",secTitle:"询问② · 证言「先冻后踢」",h3:"",h4:"",lines:[{t:"stmt",id:"S1",who:"琪露诺",act:"叉腰挺胸",text:"对对对，是先冻住的！刚才那是最强的我在考你们啦！"},{t:"stmt",id:"S2",who:"琪露诺",act:"比划手势",text:'放完冷气以后，最强的我就从鸟居那边"嗖——"地滑了过去！'},{t:"stmt",id:"S3",who:"琪露诺",act:"扬起下巴",text:"冰面上那道长长的滑痕，就是最强的我滑出来的啦！"},{t:"stmt",id:"S4",who:"琪露诺",act:"一脚前踢",text:'滑到那个破箱子跟前，"咚"地一脚！完美搞定！'},{t:"stmt",id:"S5",who:"琪露诺",act:"眼神乱瞟，冰翅膀开始滴水，悄悄用手去扶",text:"然后、然后最强的我就潇洒地离开神社了，哼！"}]},{key:"2|09||",batch:2,sec:"09",secTitle:"询问② · 证言完毕后的过渡",h3:"",h4:"",lines:[{t:"say",who:"映姬",inner:!1,act:"",text:"先以寒气冰封参道，再借冰面滑行至拜殿前踢碎木箱……先后顺序确已修正。"},{t:"say",who:"文",inner:!1,act:"微笑托腮",text:"这回顺序对了，作案经过也完整了。这下总该铁证如山了吧，灵梦小姐？"},{t:"say",who:"魔理沙",inner:!1,act:"抱臂沉思",text:"啧，被她这么一改，听着倒是顺多了。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……顺不顺，问过才知道。"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩方，请开始你的第二轮询问。"}]},{key:"2|10||",batch:2,sec:"10",secTitle:"询问② · 追问",h3:"",h4:"",lines:[{t:"sys",text:"「看破境界」在正解 1 之后才开放（见 12 节）。在此之前，S5 只能追问"}]},{key:"2|10|追问 S1|",batch:2,sec:"10",secTitle:"询问② · 追问",h3:"追问 S1",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"……考我们。我看你是被拆穿之后现学现卖吧。"},{t:"say",who:"琪露诺",inner:!1,act:"跺脚",text:"才不是现学现卖呢！那叫……那叫倒叙法！懂不懂啦！"},{t:"say",who:"魔理沙",inner:!1,act:"噗嗤一笑",text:"哟，小冰精居然还知道倒叙法，是谁教你的？"},{t:"say",who:"琪露诺",inner:!1,act:"得意晃脑袋",text:"听人里说书先生讲的！反着说才显得最强的我很有文化嘛！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……看来是彻底没法跟她的脑回路讲道理了。"}]},{key:"2|10|追问 S2|",batch:2,sec:"10",secTitle:"询问② · 追问",h3:"追问 S2",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"你说你放完冷气以后，从鸟居那边滑了过去。你确定自己放冷气的时候，是站在鸟居底下吗。"},{t:"say",who:"琪露诺",inner:!1,act:"拍胸脯",text:"当然是从最强的我放冷气的地方开始滑啦！咱落地的时候就站在大鸟居正底下呢！"},{t:"say",who:"文",inner:!1,act:"点头",text:"这一点本记者的第二张特写照片也能佐证哦。鸟居正下方的冰层最厚，里面还封着琪露诺小姐的脚印呢！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……这只天狗，倒是比被告本人还上心。"}]},{key:"2|10|追问 S3|",batch:2,sec:"10",secTitle:"询问② · 追问",h3:"追问 S3",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"参道冰面上那道滑痕，真的是你滑出来的吗。"},{t:"say",who:"琪露诺",inner:!1,act:"仰头哼声",text:"那还用问！整座神社都被最强的我冻住了，除了咱还能有谁在上面溜冰啦！"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"说得也是。那天大清早的，谁会闲着没事跑去神社溜冰。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……我的神社，可不是给妖精开的溜冰场。"}]},{key:"2|10|追问 S4|",batch:2,sec:"10",secTitle:"询问② · 追问",h3:"追问 S4",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"一边在冰上高速滑行，一边还能精准刹住车踢碎箱子，你自己信吗。"},{t:"say",who:"琪露诺",inner:!1,act:"挥拳",text:"哼！最强的我连弹幕都能闭着眼睛躲，踢个死木头箱子还不是手到擒来！"},{t:"say",who:"映姬",inner:!1,act:"",text:"被告，庭上陈述只需说明事实，无需夸耀武力。"},{t:"say",who:"琪露诺",inner:!1,act:"缩脖子",text:"唔……知、知道了啦，阎王大人。"}]},{key:"2|10|追问 S5|",batch:2,sec:"10",secTitle:"询问② · 追问",h3:"追问 S5",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:'踢完箱子就"潇洒地离开"了。既不进屋找我决斗，也不顺手拿走地上的钱吗。'},{t:"say",who:"琪露诺",inner:!1,act:"声音突然拔高，手忙脚乱扶翅膀",text:"谁、谁让灵梦你不在家嘛！最强的我一看没人应战，当然就、就潇洒地转身飞走啦！"},{t:"say",who:"魔理沙",inner:!1,act:"歪头盯她",text:'喂，灵梦，你看她一说到"离开"两个字，眼神就往天上飘咯。'},{t:"say",who:"灵梦",inner:!0,act:"",text:"……何止是眼神乱飘。刚才那句话，从头到尾都透着一股不对劲的味道。"}]},{key:"2|11|错误出示 E2 现场照片②·鸟居下特写|",batch:2,sec:"11",secTitle:"询问② · 错误出示与正确指证 1",h3:"错误出示 E2 现场照片②·鸟居下特写",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"看这张鸟居底下的特写照片。你的脚印还封在厚冰下面呢。"},{t:"say",who:"琪露诺",inner:!1,act:"骄傲叉腰",text:"对呀！那就是最强的我留下的到此一游印记啦！是不是踩得特别深、特别帅！"},{t:"say",who:"文",inner:!1,act:"微笑",text:"灵梦小姐，这张照片恰恰证明琪露诺小姐确实站在鸟居下放过冷气哦，您是不是拿错照片了呢？"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"出示之证物与证言并无矛盾。博丽灵梦，你的善行扣除一星。"}]},{key:"2|11|错误出示 E6《缘起》·琪露诺|",batch:2,sec:"11",secTitle:"询问② · 错误出示与正确指证 1",h3:"错误出示 E6《缘起》·琪露诺",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"阿求的《幻想乡缘起》里写着，你的冷气离自身越近冻得越厚。"},{t:"say",who:"琪露诺",inner:!1,act:"点头如捣蒜",text:"没错没错！所以鸟居底下的冰才冻得跟石头一样厚嘛！这有什么不对啦？"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:'能力档案仅能说明鸟居下冰厚之成因，单凭此卷不足以驳倒"滑行"之说。辩方，你的善行扣除一星。'},{t:"say",who:"灵梦",inner:!0,act:"",text:"……光拿她的档案出来，反倒像是在替她作证。"}]},{key:"2|11|指证 S2 或 S3 × E1 现场照片①·参道全景 · 正解 1|",batch:2,sec:"11",secTitle:"询问② · 错误出示与正确指证 1",h3:"指证 S2 或 S3 × E1 现场照片①·参道全景 · 正解 1",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"指证",text:"慢着。琪露诺，你说冰面上那道滑痕是你滑出来的，而且是从鸟居底下开始滑的，对吧。"},{t:"say",who:"琪露诺",inner:!1,act:"",text:"对、对呀！有什么问题啦！"},{t:"say",who:"灵梦",inner:!1,act:"出示 E1",text:"那就睁大眼睛看看第一张参道全景照片。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"根据《幻想乡缘起》和第二张照片，你放冷气的时候确实站在鸟居底下，所以那里的冰最厚，还封住了你的脚印。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"而且你的冰极冷，遇上红雾的湿气片刻就会挂上一层白霜，只要有人在上面滑过，必定会留下痕迹。"},{t:"say",who:"魔理沙",inner:!1,act:"指着照片①",text:"可是你看这张全景照片！从鸟居底下往前那五步，冰霜干净得跟新的一样，那道长滑痕的起点，分明是在晾衣绳底下！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"要是真像你说的从鸟居一路滑过去，这前五步的滑痕是被谁吃了吗。"},{t:"say",who:"琪露诺",inner:!1,act:"满头大汗，支支吾吾",text:"呃？！那、那是因为……对啦！"},{t:"say",who:"琪露诺",inner:!1,act:"一口气硬编长句",text:"那是因为最强的我觉得直接从地上滑过去太普通了，所以最强的我就先在天上飞了五步，飞到灵梦晾的衣服底下再落到冰面上开始滑的——"},{t:"say",who:"琪露诺",inner:!1,act:"挠头卡壳",text:"……嗯？不对，咱前面说的是什么来着？"},{t:"say",who:"魔理沙",inner:!1,act:"半月眼",text:"……先飞五步，再落地滑？小冰精，你这理由编到一半，自己先把自己绕晕了吧！"},{t:"say",who:"文",inner:!1,act:"举起团扇挡脸",text:"咳、咳咳！妖精小姐行事向来天马行空，先飞五步再滑行，在物理上也并非完全不可能呢！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……还在嘴硬。既然普通证物撬不开她的嘴，那就换个办法吧。"}]},{key:"2|12|看破推理之后 · 当庭点破|",batch:2,sec:"12",secTitle:"询问② · 「看破境界」教学与琪露诺崩溃",h3:"看破推理之后 · 当庭点破",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"睁开眼，冷冷开口",text:'……琪露诺。别再拿什么"潇洒离开"往自己脸上贴金了。'},{t:"say",who:"琪露诺",inner:!1,act:"浑身一颤",text:"干、干嘛突然眯着眼睛看咱啦！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"那天早上你刚落到鸟居底下，就看到了什么把你吓破胆的东西，当场吓得冷汗直冒、乱放了一通冷气吧。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"放完冷气你就直接抱头逃跑了，根本没有滑过参道，更没有碰过我的赛钱箱——那只箱子，是在你逃走以后才碎掉的。"},{t:"say",who:"琪露诺",inner:!1,act:"脸色煞白，跳脚尖叫",text:"胡、胡说八道——！！谁被吓跑了啦！"},{t:"fx",label:"演出",text:'琪露诺崩溃——背后的冰翅膀"咔嚓"一声裂开一道缝，她哇哇大哭着一屁股跌坐在证人席上，寒气失控把她半截身子冻在了冰坨里'},{t:"say",who:"琪露诺",inner:!1,act:"哇哇大哭",text:"呜哇啊啊啊——！不怪咱嘛！那天早上，灵梦你晾在绳子上的衣服上，有一大团黑乎乎的怪物！还长着好多条白胳膊在那儿乱挥乱扑腾！"},{t:"say",who:"琪露诺",inner:!1,act:"抽泣嘴硬",text:"才、才没吓到最强的我呢！最强的我只是闭着眼睛放了一发无差别全屏冷气，然后执行了战略性撤退嘛——！"},{t:"say",who:"魔理沙",inner:!1,act:"目瞪口呆",text:"搞了半天，你是因为被晾衣绳上的东西吓破了胆，闭着眼乱放冷气冻住了神社，然后直接哭着逃跑了咯？！"},{t:"say",who:"琪露诺",inner:!1,act:"在冰坨里疯狂捶地",text:'那不叫逃跑！叫战略性撤退！而且、而且那天中午咱听人念了报纸，说神社被"冰之恶魔"砸烂了——'},{t:"say",who:"琪露诺",inner:!1,act:"",text:'咱一想，神社的冰确实是咱冻的，那箱子肯定也是最强的我放冷气时顺便震碎的嘛！比起"战略性撤退"，当传说中的冰之大恶魔威风多了啦！'},{t:"say",who:"灵梦",inner:!0,act:"",text:'……为了死撑"最强"的面子，宁可认下砸神社的罪名去彼岸挑水五十年，也不肯承认自己被吓跑了吗。真是彻头彻尾的笨蛋。'},{t:"say",who:"灵梦",inner:!0,act:"",text:'刚才她嘴硬喊着"才没吓到最强的我"的时候，我的「看破」明明还扎得眼皮直跳。'},{t:"say",who:"灵梦",inner:!0,act:"",text:'可说起那个"黑乎乎一大团、长着好多白胳膊的怪物"时，「看破」却一点反应都没有。'},{t:"say",who:"灵梦",inner:!0,act:"",text:"这说明她在这件事上没有撒谎——她是真心实意地相信，自己当时看见了那样的怪物。"},{t:"fx",label:"演出",text:'证言记录 T1 琪露诺的怪物（"黑乎乎一团，长着好多白胳膊，在灵梦的衣服上乱扑腾"）收入法庭记录'},{t:"fx",label:"演出",text:"人物档案 琪露诺 更新"}]},{key:"2|13||",batch:2,sec:"13",secTitle:"询问②尾声 · 惊喜证人登场",h3:"",h4:"",lines:[{t:"say",who:"映姬",inner:!1,act:"敲桌",text:"肃静。辩护人的直觉，本庭不予采信；但被告方才亲口所述，记录在案。"},{t:"say",who:"映姬",inner:!1,act:"",text:"被告既已改称放完冷气便即刻逃离、未曾靠近赛钱箱，其认罪供述已不足采信。检方射命丸文，你还有何话说。"},{t:"say",who:"文",inner:!1,act:"收起笑容，轻轻鼓掌",text:"啪、啪、啪。精彩，真是太精彩了呢，灵梦小姐！"},{t:"say",who:"灵梦",inner:!1,act:"",text:'……你笑什么。你的"冰之恶魔"已经招供自己只是个逃跑的胆小鬼了。'},{t:"say",who:"文",inner:!1,act:"嘴角扬起，团扇一指",text:"谁说检方只靠被告自己的口供定罪了？关于琪露诺小姐踢碎赛钱箱的一幕——本记者手里，可是握有一位真正的现场目击证人哦！"},{t:"say",who:"魔理沙",inner:!1,act:"吃惊",text:"啥？！那天大清早的红雾里，神社附近居然还有别人？！"},{t:"say",who:"映姬",inner:!1,act:"",text:"检方，你的证人现在何处。"},{t:"say",who:"文",inner:!1,act:"",text:"就在公堂候审室呢！法警小姐，劳驾把她带上来吧！"},{t:"say",who:"小町",inner:!1,act:"打了个哈欠",text:"呼啊——候审室离这儿可有三十步远呐。四季大人，批我用一下能力省省腿脚呗？"},{t:"say",who:"映姬",inner:!1,act:"",text:"准。"},{t:"say",who:"阿求",inner:!1,act:"提笔",text:"记下了。"},{t:"fx",label:"演出",text:"《缘起》Y3 小野塚小町 收入《缘起》"},{t:"fx",label:"演出",text:"公堂门口的空气一晃，露米娅出现在门边"},{t:"say",who:"小町",inner:!1,act:"",text:"人带到了。怕她一进门就撞柱子，在候审室就先让她把黑暗收起来了。"},{t:"sfx",text:'缓慢的脚步声，伴随着轻微的"叮当"脆响'},{t:"fx",label:"演出",text:"金发红丝带的幼小妖怪——露米娅，保持着双臂平伸的姿势，慢吞吞地走上证人席"},{t:"say",who:"露米娅",inner:!1,act:"歪着头看向辩护席",text:"咦，灵梦在这里呀～你是今天可以吃的人类吗～？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"不是。站好作证。"},{t:"say",who:"露米娅",inner:!1,act:"乖巧点头，身体一晃",text:"哦，是这样吗～"},{t:"sfx",text:"叮当"},{t:"say",who:"阿求",inner:!1,act:"翻开书页",text:"四季大人，阿求先行呈交新证人的《幻想乡缘起》能力备案。"},{t:"say",who:"阿求",inner:!1,act:"档案腔",text:"露米娅，宵暗的妖怪。具操纵黑暗程度的能力。"},{t:"say",who:"阿求",inner:!1,act:"",text:"展开黑暗时，从外面看是一团直径约一人高的黑球。她自己在黑暗里也看不见，常撞到树。白天移动时几乎总是展开黑暗。"},{t:"say",who:"阿求",inner:!1,act:"",text:'飞行时总是双臂平伸，本人称"像被钉在十字架上的圣人"。食量很大。'},{t:"fx",label:"演出",text:"证物 E8《缘起》·露米娅、人物档案 露米娅 收入法庭记录"},{t:"say",who:"映姬",inner:!1,act:"",text:"备案完毕。证人露米娅，请当庭陈述你于案发当日清晨所见之景。"},{t:"say",who:"露米娅",inner:!1,act:"双臂平伸，软绵绵地笑",text:"好呀～那天早上的事，我看得清清楚楚的哦～"}]},{key:"3|14||",batch:3,sec:"14",secTitle:"询问③ · 证言「我看得清清楚楚～」",h3:"",h4:"",lines:[{t:"stmt",id:"S1",who:"露米娅",act:"双臂平伸，慢吞吞晃脑袋",text:"那天早上，我在神社旁边的树林里散步哦～"},{t:"stmt",id:"S2",who:"露米娅",act:"眯眼微笑",text:"我躲在大树后面，把外面的事看得清清楚楚的～"},{t:"stmt",id:"S3",who:"露米娅",act:"轻轻点头",text:'琪露诺"咚"地一脚，就把那个木箱子踢碎了哦～'},{t:"stmt",id:"S4",who:"露米娅",act:"歪头",text:'然后她就"嗖"地一下跑掉了～是这样的～'}]},{key:"3|15||",batch:3,sec:"15",secTitle:"询问③ · 证言完毕后的过渡",h3:"",h4:"",lines:[{t:"say",who:"映姬",inner:!1,act:"",text:"证人自称在神社树林之中，亲眼目睹被告踢碎赛钱箱之全过程。"},{t:"say",who:"文",inner:!1,act:"摇扇微笑",text:"人证物证俱全了呢！灵梦小姐，这位小妖怪总不会也跟您的赛钱箱有仇吧？"},{t:"say",who:"魔理沙",inner:!1,act:"挠头",text:"这小家伙看着呆呆的，应该不会主动编瞎话害人吧？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……一见面就问我能不能吃的家伙，我可不觉得她有多老实。"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩方，请开始你的询问。"}]},{key:"3|16|追问 S1|",batch:3,sec:"16",secTitle:"询问③ · 追问",h3:"追问 S1",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"那天早上红雾那么浓，你一个宵暗的妖怪，大清早跑去神社旁边的树林里干什么。"},{t:"say",who:"露米娅",inner:!1,act:"平伸的双臂晃了晃",text:"因为肚子咕噜噜叫，好饿呀～我想在树林里找点吃的哦～"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"找吃的找到博丽神社旁边？灵梦那穷地方，连耗子路过都得哭着走吧！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……闭嘴，魔理沙。那后来呢，你在树林里找到吃的了吗。"},{t:"say",who:"露米娅",inner:!1,act:"歪头笑",text:"唔……那是秘密哦～"}]},{key:"3|16|追问 S2|",batch:3,sec:"16",secTitle:"询问③ · 追问",h3:"追问 S2",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"你说你躲在大树后面，看得清清楚楚。当时天刚蒙蒙亮，又全是红雾，你真看得见吗。"},{t:"say",who:"露米娅",inner:!1,act:"理所当然地点头",text:"看得清清楚楚的呀～连大树长什么样都看得见哦～"},{t:"say",who:"文",inner:!1,act:"帮腔",text:"灵梦小姐，妖怪的夜视能力本来就比人类强得多，躲在树后看清参道上的动静有什么奇怪的呢？"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……看得清清楚楚，是吗。这句话，我怎么听都觉得别扭。"}]},{key:"3|16|追问 S3|",batch:3,sec:"16",secTitle:"询问③ · 追问",h3:"追问 S3",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:'你说琪露诺"咚"地一脚把木箱子踢碎了。那她用的是左脚还是右脚，踢完之后箱子飞到哪儿去了。'},{t:"say",who:"露米娅",inner:!1,act:"手指点着下巴，卡壳",text:"唔……左脚还是右脚呀……然后……然后……"},{t:"say",who:"露米娅",inner:!1,act:"突然抬头，一脸纯真",text:"反正文文说的就是这样哦～"},{t:"say",who:"文",inner:!1,act:"笑容瞬间僵在脸上，手里的快门咔嚓连按",text:"咔嚓、咔嚓！露、露米娅妹妹，庭上作证不用提本记者的名字呀！"},{t:"say",who:"灵梦",inner:!1,act:"半月眼",text:'……"文文说的就是这样"。大记者，这就是你所谓的铁证如山吗。'},{t:"say",who:"文",inner:!1,act:"团扇狂扇",text:'这、这怎么能怪我呢！本记者在树林里采访她的时候，只是礼貌地问了一句"你看见冰精踢箱子了吧"，是她自己点头说"是这样吗"的呀！'},{t:"say",who:"映姬",inner:!1,act:"严厉敲桌",text:"将预设的答案塞进问题之中，诱使幼小妖怪顺从附和——射命丸文，你就是太会诱导了。"},{t:"say",who:"文",inner:!1,act:"缩脖子鞠躬",text:"是、是！本记者下次一定注意采访措辞！"},{t:"say",who:"映姬",inner:!1,act:"目光转向证人席",text:"证人露米娅，本庭当面问你。被告踢碎木箱一事，你当真亲眼所见？"},{t:"say",who:"露米娅",inner:!1,act:"平伸的双臂往下一垂，又慌忙抬平",text:"看、看见了哦～是这样的～"},{t:"say",who:"映姬",inner:!1,act:"",text:"……证人既仍一口咬定亲眼所见，单凭检方采访失当，尚不足以全盘推翻其供述。辩方，须以实据驳之。"}]},{key:"3|16|追问 S4|",batch:3,sec:"16",secTitle:"询问③ · 追问",h3:"追问 S4",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:'你说琪露诺踢完箱子就"嗖"地跑掉了。她往哪个方向跑的。'},{t:"say",who:"露米娅",inner:!1,act:"身体晃了一下，平伸的手臂微微下垂",text:"唔……往那边吧～是这样的～"},{t:"sfx",text:"叮当"},{t:"say",who:"魔理沙",inner:!1,act:"竖起耳朵",text:'等一下！什么声音？刚才是不是有什么东西"叮当"响了一下？'},{t:"say",who:"露米娅",inner:!1,act:"双手猛地重新抬平，闭眼摇头",text:"没、没有声音哦～什么都没有响～"},{t:"say",who:"文",inner:!1,act:"连忙打岔",text:"咳咳！许是公堂屋檐下的风铃响了吧！请辩方不要纠结这种无关紧要的杂音哦！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……公堂屋檐下，哪来的风铃。"}]},{key:"3|17|错误出示 E6《缘起》·琪露诺|",batch:3,sec:"17",secTitle:"询问③ · 错误出示",h3:"错误出示 E6《缘起》·琪露诺",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"看看这份能力档案，就能知道你说的有问题了。"},{t:"say",who:"琪露诺",inner:!1,act:"从被告席兴奋地跳起来挥手",text:"哇！又拿咱的档案出来啦！露米娅你快看，咱的智力那一栏可是⑨呢！最高分！"},{t:"say",who:"露米娅",inner:!1,act:"歪头",text:"哇，是这样吗～？九比一大好多呢～"},{t:"say",who:"琪露诺",inner:!1,act:"叉腰狂笑",text:"哼哼！第一名算什么，第九名可是比第一名足足大八倍啦！"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"被告不得喧哗。博丽灵梦，琪露诺的档案与本轮目击证词毫无干系，你的善行扣除一星。"}]},{key:"3|17|错误出示 E1 现场照片①·参道全景|",batch:3,sec:"17",secTitle:"询问③ · 错误出示",h3:"错误出示 E1 现场照片①·参道全景",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"这张参道全景照片上，根本没有拍到你站在树林里。"},{t:"say",who:"露米娅",inner:!1,act:"眨眼",text:"因为我躲在大树后面呀～照片拍不到树后面，是这样的吧～"},{t:"say",who:"文",inner:!1,act:"微笑",text:"没错哦，参道全景本来就拍不到树林里面呀。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"照片未曾拍到，不等于证人不在场。辩方，你的善行扣除一星。"}]},{key:"3|18|步骤 1：指证 S2 × E8《缘起》·露米娅 · 正解|",batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:"步骤 1：指证 S2 × E8《缘起》·露米娅 · 正解",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"指证",text:'慢着。露米娅，你说你躲在树后面"看得清清楚楚"，这根本不可能吧。'},{t:"say",who:"露米娅",inner:!1,act:"歪头",text:"咦？为什么不可能呀～"},{t:"say",who:"灵梦",inner:!1,act:"出示 E8",text:"刚才阿求念过的《幻想乡缘起》里写得明明白白。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"你在白天移动的时候，几乎总是展开黑暗。而且最要命的是——你自己在那团黑暗里，也是什么都看不见的。"},{t:"say",who:"魔理沙",inner:!1,act:"一拍手",text:"对咯！连平时飞着飞着都会一头撞上树的家伙，怎么可能隔着老远看清谁踢了箱子！"},{t:"say",who:"露米娅",inner:!1,act:"平伸的手臂垂下一点，眨巴眼",text:"唔……可是那天早上的红雾已经很暗了，所以我没有展开黑暗哦～"},{t:"say",who:"文",inner:!1,act:"一敲团扇",text:'听见了吗，灵梦小姐！档案上写的是"几乎总是"，又不是绝对！那天红雾蔽日，露米娅妹妹没开黑暗，自然就能看清外面了呀！'},{t:"say",who:"灵梦",inner:!0,act:"",text:'……把"没开黑暗"当借口吗。要想堵死她这句谎话，我必须拿出证据，证明那天早上她确确实实开着那团黑暗。'},{t:"say",who:"映姬",inner:!1,act:"",text:"辩方，你可有证据表明证人当时展开了黑暗？"}]},{key:'3|18|▶ 步骤 2：出示证物，证明"露米娅当时开着黑暗" · 正解：T1 证言记录·琪露诺的怪物|',batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:'▶ 步骤 2：出示证物，证明"露米娅当时开着黑暗" · 正解：T1 证言记录·琪露诺的怪物',h4:"",lines:[]},{key:'3|18|▶ 步骤 2：出示证物，证明"露米娅当时开着黑暗" · 正解：T1 证言记录·琪露诺的怪物|出示错误证物（通用）',batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:'▶ 步骤 2：出示证物，证明"露米娅当时开着黑暗" · 正解：T1 证言记录·琪露诺的怪物',h4:"出示错误证物（通用）",lines:[{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"此物无法证明证人当时是否展开黑暗。博丽灵梦，你的善行扣除一星。"}]},{key:'3|18|▶ 步骤 2：出示证物，证明"露米娅当时开着黑暗" · 正解：T1 证言记录·琪露诺的怪物|出示 T1（正解）',batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:'▶ 步骤 2：出示证物，证明"露米娅当时开着黑暗" · 正解：T1 证言记录·琪露诺的怪物',h4:"出示 T1（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示 T1",text:"证明她开着黑暗的证据，刚才琪露诺已经在庭上哭着喊出来了。"},{t:"say",who:"文",inner:!1,act:"挑眉",text:"琪露诺小姐的证言？那上面只写着她看见了什么怪物吧？"},{t:"say",who:"灵梦",inner:!1,act:"",text:'听清楚琪露诺是怎么形容那个怪物的——"黑乎乎一大团，长着好多白胳膊，在我的衣服上乱扑腾"。'},{t:"say",who:"灵梦",inner:!1,act:"",text:"根据《缘起》记载，露米娅展开黑暗的时候，从外面看过去，就正好是一团直径一人高的黑球。"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"黑乎乎一大团……那不就是从外面看露米娅的黑暗球的样子吗！"},{t:"say",who:"文",inner:!1,act:"冷笑一声",text:"呵，我还当是什么铁证呢！那天早上漫天都是浓雾，光线昏暗，笨蛋妖精把自己吓昏了头，看什么不是黑乎乎一团？这种胡话也能当证据吗？"},{t:"say",who:"灵梦",inner:!1,act:"",text:'……如果只是光线暗，那她为什么偏偏又能看清周围乱甩的"白胳膊"呢。黑白分明，说明黑的只有中间那一团。'},{t:"say",who:"文",inner:!1,act:"语塞一瞬，随即强笑",text:"那、那也只能说明晾衣绳上有团黑影，凭什么断定那就是露米娅妹妹？本记者提交的三张现场照片里，晾衣绳可都在远景里，根本看不清细节哦！"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩方。你坚称晾衣绳上那团黑影便是证人露米娅——此说可有实据支撑？"}]},{key:"3|18|▶ 步骤 3：出示证物 · 正解：E4《文文。新闻》号外|",batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:"▶ 步骤 3：出示证物 · 正解：E4《文文。新闻》号外",h4:"",lines:[]},{key:"3|18|▶ 步骤 3：出示证物 · 正解：E4《文文。新闻》号外|出示错误证物（通用）",batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:"▶ 步骤 3：出示证物 · 正解：E4《文文。新闻》号外",h4:"出示错误证物（通用）",lines:[{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"此物无从证明晾衣绳上的黑影是谁。博丽灵梦，你的善行扣除一星。"}]},{key:"3|18|▶ 步骤 3：出示证物 · 正解：E4《文文。新闻》号外|出示 E8《缘起》·露米娅 或 人物档案·露米娅",batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:"▶ 步骤 3：出示证物 · 正解：E4《文文。新闻》号外",h4:"出示 E8《缘起》·露米娅 或 人物档案·露米娅",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"能变成一人高黑球的宵暗妖怪，除了露米娅还能有谁。"},{t:"say",who:"文",inner:!1,act:"摇扇轻笑",text:"哎呀，档案只能说明露米娅妹妹会变成黑球。可那天早上红雾弥漫，晾衣绳上挂着的一团黑影，谁能担保一定就是她本人呢？"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"单凭习性相似，尚不足以坐实身份。博丽灵梦，你的善行扣除一星。"}]},{key:"3|18|▶ 步骤 3：出示证物 · 正解：E4《文文。新闻》号外|出示 E4《文文。新闻》号外（正解）",batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:"▶ 步骤 3：出示证物 · 正解：E4《文文。新闻》号外",h4:"出示 E4《文文。新闻》号外（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示 E4",text:"实据当然有。而且现在就揣在对面的大记者怀里。"},{t:"say",who:"灵梦",inner:!1,act:"",text:'劳驾低头念念你那份号外右下角印着的小字——"本报记者现场独家拍摄四张"。'},{t:"fx",label:"演出",text:"证物 E4 更新"},{t:"say",who:"魔理沙",inner:!1,act:"掰着手指算",text:"一、二、三……喂，大记者，你交上来的现场照片可只有三张啊！第四张照片被你藏哪儿去了？！"},{t:"say",who:"文",inner:!1,act:"满头大汗，团扇扇得飞快，把刘海都吹乱了",text:"咔嚓、咔嚓！哎呀，那、那第四张只是本记者顺手拍的私人工作自拍哦！跟案子半点关系都没有，当然用不着呈堂了呀！"},{t:"say",who:"映姬",inner:!1,act:"严厉",text:"与本案有无关系，由本庭裁定。射命丸文，即刻呈上第四张照片。"},{t:"say",who:"文",inner:!1,act:"垂头丧气，不情不愿地抽出一张照片",text:"唔……交就交。先说好，那天早上风大，本记者的刘海可是吹得乱糟糟的，谁都不许笑话我哦……"},{t:"fx",label:"演出",text:"证物 E9 文的空中自拍 收入法庭记录"},{t:"fx",label:"演出",text:"人物档案 文 更新"}]},{key:"3|18|步骤 4：观察 E9|",batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:"步骤 4：观察 E9",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"凑过去看照片",text:"让我瞧瞧……嚯！整张照片一大半都是你自己的大脸，居然还对着镜头比剪刀手！"},{t:"say",who:"文",inner:!1,act:"挺胸得意",text:"那当然！本记者可是特意悬停在参道正上空自拍留念的，背后就是整条冰封的参道，取景构图讲究着呢！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……等等。她脑袋后面，背景里晾衣绳那一带。那张冻住的大床单，样子好像有点不对劲。照片上缩得太小了，得凑近点才看得清。"},{t:"fx",label:"演出",text:"查验 E9"}]},{key:'3|18|▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅|',batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:'▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅',h4:"",lines:[]},{key:'3|18|▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅|没看清照片就出示人物档案',batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:'▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅',h4:"没看清照片就出示人物档案",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示人物档案",text:"晾衣绳上那团黑影……就是这个人。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"辩方，那张自拍背景里的物件究竟是何模样，你自己都尚未查验看清，便要凭空指认何人。"},{t:"say",who:"映姬",inner:!1,act:"",text:"先将照片里的端倪查验清楚，再来指认。博丽灵梦，你的善行扣除一星。"}]},{key:'3|18|▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅|出示人物档案·博丽灵梦',batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:'▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅',h4:"出示人物档案·博丽灵梦",lines:[{t:"say",who:"灵梦",inner:!1,act:"指着自己",text:"那个裹在床单里乱扑腾的人……其实是我自己。"},{t:"say",who:"魔理沙",inner:!1,act:"目瞪口呆",text:"哈？！你大清早闲着没事钻进自家的湿床单里摆十字架，图什么呀？！"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"就算是为了骗取赔偿，此等苦肉计也未免太过荒唐。博丽灵梦，你的善行扣除一星。"}]},{key:'3|18|▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅|出示人物档案·四季映姬',batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:'▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅',h4:"出示人物档案·四季映姬",lines:[{t:"say",who:"灵梦",inner:!1,act:"面不改色地一指审判席",text:"床单里那个双臂平伸的人，难道不是阎魔大人吗。"},{t:"say",who:"映姬",inner:!1,act:"额角青筋微跳，举起悔悟棒",text:"……本庭执掌是非黑白，何曾在大清早飞进你的神社钻过床单。"},{t:"say",who:"映姬",inner:!1,act:"重重敲击悔悟棒",text:"博丽灵梦，诽谤审判长，罪加一等。你的善行扣除一星。"}]},{key:'3|18|▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅|出示错误人物档案（通用）',batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:'▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅',h4:"出示错误人物档案（通用）",lines:[{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"此人并无双臂平伸之习性。博丽灵梦，你的善行扣除一星。"}]},{key:'3|18|▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅|出示人物档案·露米娅（正解）',batch:3,sec:"18",secTitle:"询问③ · 连续推理链（S2 × E8 → T1 → E4 → E9 → 指认露米娅）",h3:'▶ 步骤 5：出示人物档案，指认"床单里的人是谁" · 正解：人物档案·露米娅',h4:"出示人物档案·露米娅（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示露米娅档案",text:"别光顾着看大记者的脸。大家凑近了看看，她这张自拍背景里晾衣绳上的那张冻床单。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"冰层是从里面往外裂开的。说明当时有什么东西被裹在床单里，冻住之后，又硬生生从里面挣破了出来。"},{t:"say",who:"文",inner:!1,act:"抱臂撇嘴",text:"就算里面裹过什么东西，那东西早就跑掉了，怎么证明里面裹过谁呢？"},{t:"say",who:"灵梦",inner:!1,act:"",text:'跑是跑掉了。可那家伙被冻在床单里的时候，在冻硬的床单上留下了一个再标准不过的"模子"。'},{t:"say",who:"灵梦",inner:!1,act:"",text:"床单正中间那个十字形空洞的主人——就是站在证人席上的露米娅。"},{t:"say",who:"露米娅",inner:!1,act:"保持着双臂平伸，歪着脑袋晃了晃",text:"咦，照片上这个洞，跟我很像吗～？看起来像被钉在十字架上的圣人吗～？"},{t:"say",who:"魔理沙",inner:!1,act:"指着她的姿势吐槽",text:"你自己不就正摆着这个姿势吗！简直跟印章盖出来的一模一样！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"这下全都串起来了。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"那天早上，露米娅展开着黑暗在神社附近乱飞迷了路，结果一头扎进了我的晾衣绳，被这张白色的大床单裹在了里面。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"因为大床单比她的黑暗球更大，她在里面慌张乱扑腾的时候，露在黑球外面的白色床单四角到处乱甩——"},{t:"say",who:"魔理沙",inner:!1,act:"",text:'所以刚飞上石阶的琪露诺，远远看见一团黑乎乎的东西甩着白布条，就以为是"长着好多白胳膊的黑团子怪物"，吓得闭眼放冷气把她连同床单一起冻住喽！'},{t:"say",who:"琪露诺",inner:!1,act:"在被告席上猛拍大腿",text:"什、什么？！那个大怪物居然是露米娅裹着破床单变的？！害得最强的我白白放了一发大招啦！"},{t:"say",who:"露米娅",inner:!1,act:"恍然大悟，软绵绵点头",text:"啊～怪不得那天早上我飞着飞着，突然被软软的东西抱住了，然后又变得好冷好冷呢～原来是琪露诺呀，是这样吗～"},{t:"say",who:"文",inner:!1,act:"脸色铁青，握着相机的手直抖",text:"怎、怎么会这样……本记者找来的目击证人，自己就是那个把被告吓跑的怪物？！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"她当时开着伸手不见五指的黑暗，整个人又被死死裹在我的床单里——绝不可能在树林里看见谁踢碎了赛钱箱。"},{t:"say",who:"映姬",inner:!1,act:"点头",text:"事实俱在。证人露米娅方才之目击证词，本庭裁定无效。"},{t:"fx",label:"演出",text:"人物档案 露米娅 更新"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……等等。把文那张自拍背景里的冻床单，和第一张参道全景照片摆在一起看的话——"},{t:"say",who:"灵梦",inner:!0,act:"",text:"参道冰面上那道长滑痕的起点，不偏不倚，正好就在露米娅钻出来的那张十字空洞床单正下方。"},{t:"fx",label:"演出",text:"证物 E1 现场照片①·参道全景 更新"},{t:"say",who:"灵梦",inner:!1,act:"",text:"别急着下台啊，露米娅。既然琪露诺在鸟居底下放完冷气就逃跑了，那当时留在神社院子里的活物，可就只剩刚从冻床单里挣脱出来的你一个了。"},{t:"say",who:"露米娅",inner:!1,act:"原本平伸的双臂猛地垂了下来，连连摇头",text:"唔……我、我只是从软软的东西里钻出来而已哦～那个木箱子，我可没有碰过哦～"},{t:"say",who:"映姬",inner:!1,act:"",text:"证人露米娅，就你挣脱床单之后的行止，即刻向本庭如实供述。"}]},{key:"4|19||",batch:4,sec:"19",secTitle:"询问④ · 证言「黑漆漆的早上」",h3:"",h4:"",lines:[{t:"stmt",id:"S1",who:"露米娅",act:"双臂平伸，轻轻晃悠",text:"我飞着飞着，突然被软软的东西缠住了哦～"},{t:"stmt",id:"S2",who:"露米娅",act:"缩了缩脖子",text:"然后变得好冷好冷，连手都冻僵了，动不了～"},{t:"stmt",id:"S3",who:"露米娅",act:"双手往外一比划",text:'我使劲一挣，"啪"地一下就钻出来了哦～'},{t:"stmt",id:"S4",who:"露米娅",act:"乖巧点头",text:"后来我就一直待在那里，什么都没碰哦～"},{t:"stmt",id:"S5",who:"露米娅",act:"歪头微笑",text:"那个木箱子，我连见都没见过～"}]},{key:"4|20||",batch:4,sec:"20",secTitle:"询问④ · 证言完毕后的过渡",h3:"",h4:"",lines:[{t:"say",who:"映姬",inner:!1,act:"",text:"证人承认曾被困于晾衣绳之床单内，但坚称挣脱之后并未触碰赛钱箱。"},{t:"say",who:"文",inner:!1,act:"整理了一下被吹乱的刘海，重新挂上微笑",text:"听见了吧，灵梦小姐？就算露米娅妹妹当时不小心钻进了您的床单，也不过是一场迷路的小插曲而已呢！"},{t:"say",who:"魔理沙",inner:!1,act:"抱臂挑眉",text:"迷路的小插曲？可当时院子里就剩她一个了，她不碰，难不成箱子自己想不开炸了？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……迷路迷到我的晾衣绳上，这插曲也太会挑地方了。"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩方，请开始你的询问。"}]},{key:"4|21|追问 S1|",batch:4,sec:"21",secTitle:"询问④ · 追问",h3:"追问 S1",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"被软软的东西缠住的时候，你就没想过把黑暗收起来看一眼吗。"},{t:"say",who:"露米娅",inner:!1,act:"摇头",text:"为什么要收起来呀～？软软的，像钻进被窝里一样舒服哦～"},{t:"say",who:"魔理沙",inner:!1,act:"半月眼",text:"把别人刚洗干净晾出去的大床单当被窝，你也真够不客气的！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……等这案子审完，洗床单的工钱也得算她头上。"}]},{key:"4|21|追问 S2|",batch:4,sec:"21",secTitle:"询问④ · 追问",h3:"追问 S2",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"突然变得好冷，那是琪露诺的冷气吧。"},{t:"say",who:"琪露诺",inner:!1,act:"在被告席上叉腰喊",text:"对啦！谁让你裹着白布在那儿乱扑腾的，最强的我还以为是大妖怪呢！"},{t:"say",who:"露米娅",inner:!1,act:"眨巴眼",text:"唔～所以那么冷是琪露诺干的呀～害我打了好多喷嚏呢～"},{t:"say",who:"映姬",inner:!1,act:"",text:"被告与证人不得在庭上私自闲谈。辩方，继续询问。"}]},{key:"4|21|追问 S3|",batch:4,sec:"21",secTitle:"询问④ · 追问",h3:"追问 S3",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"那张床单都被琪露诺冻成硬冰壳了，你是怎么挣脱出来的。"},{t:"say",who:"露米娅",inner:!1,act:"保持双臂平伸晃了晃",text:'就保持着这个姿势，使劲往外一撑，冰壳就"啪"地裂开了呀～'},{t:"say",who:"魔理沙",inner:!1,act:"",text:"嚯，所以床单正中间才会留下那么标准的一个十字架大洞啊。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……我的大床单，看来是彻底没法补了。"}]},{key:"4|21|追问 S4|",batch:4,sec:"21",secTitle:"询问④ · 追问",h3:"追问 S4",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"你说你挣脱出来之后，就一直待在晾衣绳底下，什么都没碰。"},{t:"say",who:"露米娅",inner:!1,act:"平伸的双臂微微下垂，身体一晃",text:"嗯嗯，我乖乖待在原地，一步都没有乱跑哦～"},{t:"sfx",text:"叮当"},{t:"say",who:"魔理沙",inner:!1,act:"歪头盯过去",text:'……喂，刚才那个"叮当"声又响了吧？'},{t:"say",who:"露米娅",inner:!1,act:"赶紧把手臂抬平，闭眼摇头",text:"没、没有响哦～是风吹树叶的声音呀……唔，是这样的～"},{t:"say",who:"灵梦",inner:!0,act:"",text:'……每次一说到"什么都没碰"，她的手臂就往下掉。'}]},{key:"4|21|追问 S5|",batch:4,sec:"21",secTitle:"询问④ · 追问",h3:"追问 S5",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"赛钱箱就摆在拜殿正前方，你说你连见都没见过。"},{t:"say",who:"露米娅",inner:!1,act:"理直气壮地歪头",text:"黑漆漆的，见不着呀～"},{t:"say",who:"魔理沙",inner:!1,act:"差点跌倒",text:"……对哦！她一直开着那个伸手不见五指的黑球，别说木箱子了，就算神社塌了她也见不着啊！"},{t:"say",who:"文",inner:!1,act:"掩嘴轻笑",text:"这不就结了吗？连箱子在哪儿都看不见的小妖怪，怎么可能跑去砸您的赛钱箱呢？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……你倒是替她想得挺周到。"}]},{key:"4|22|错误出示 E9 文的空中自拍|",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"错误出示 E9 文的空中自拍",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"文那张自拍的背景里，大床单上清清楚楚留着你挣脱出来的十字形大洞。"},{t:"say",who:"露米娅",inner:!1,act:"点头",text:'是呀～我已经说过了，我使劲一挣就"啪"地钻出来了哦～'},{t:"say",who:"文",inner:!1,act:"摇扇",text:"灵梦小姐，露米娅妹妹已经承认自己钻过床单了，拿本记者的工作自拍可证明不了她离开过晾衣绳哦。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"此证物与证人第四、第五句供述并无冲突。博丽灵梦，你的善行扣除一星。"}]},{key:"4|22|错误出示 E3 现场照片③·赛钱箱特写|",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"错误出示 E3 现场照片③·赛钱箱特写",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"第三张照片上，赛钱箱已经碎成一地木头片了。"},{t:"say",who:"文",inner:!1,act:"微笑",text:"箱子确实碎了呀，但照片上既没有露米娅妹妹的身影，也没有写着她的名字呢。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"单凭箱子损毁之状，不足以证明证人曾离开晾衣绳。博丽灵梦，你的善行扣除一星。"}]},{key:"4|22|指证 S4 或 S5 × E1 现场照片①·参道全景 · 正解|",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"指证 S4 或 S5 × E1 现场照片①·参道全景 · 正解",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示 E1",text:"睁大眼睛看看这张参道全景照片吧。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"这道长滑痕，起点就在你钻出来的那张破床单底下，一路笔直通到拜殿前的赛钱箱。"},{t:"say",who:"灵梦",inner:!1,act:"一指证人席",text:"露米娅，你从床单里挣脱之后根本没有待在原地——是你自己顺着参道一路滑过去，一头撞碎了我的赛钱箱！"},{t:"say",who:"露米娅",inner:!1,act:"双手捧脸，歪头眨眼",text:"咦～？是我自己滑过去撞碎了木箱子吗～？我怎么一点印象都没有呀～"},{t:"say",who:"文",inner:!1,act:'合拢折扇，"啪"地一拍手掌',text:"噗嗤……哎呀，灵梦小姐，外行人办案果然全凭一腔想象呢。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……这公堂今天才头一回开庭，满屋子谁还不是个外行。"},{t:"say",who:"文",inner:!1,act:"伸出一根手指，高声喝道",text:"您的推理里，漏掉了最核心的一环——那就是作案的「动机」！"},{t:"bgm",text:"文的法庭曲"},{t:"say",who:"文",inner:!1,act:"",text:"请问辩方，露米娅妹妹跟您的赛钱箱无冤无仇，她有什么理由非要去撞碎一只木箱子不可呢？"},{t:"say",who:"文",inner:!1,act:"扇子一指被告席",text:"反倒是被告琪露诺，动机可充足得很！她刚才自己招认过，那天早上是专门跑来找灵梦小姐决斗的吧？"},{t:"say",who:"文",inner:!1,act:"",text:"大清早兴冲冲跑来挑战，结果神社里空无一人，扑了个大空——恼羞成怒之下拿门口的赛钱箱撒气，岂不是顺理成章吗？！"},{t:"say",who:"琪露诺",inner:!1,act:"在被告席上跳脚",text:"喂！最强的我才不会拿木头箱子撒气呢！而且最强的我那时候早就战略性撤退啦！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"没错，我们刚才已经看破了，琪露诺放完冷气就直接逃跑了，根本没进参道。"},{t:"say",who:"文",inner:!1,act:"摇扇轻笑",text:"哎呀，那可只是被告为自己开脱的一面之词，外加灵梦小姐那没法当证据的直觉罢了，算不得呈堂实据哦。"},{t:"say",who:"映姬",inner:!1,act:"颔首",text:"检方所言有理。公堂断案只凭实据，被告之辩词若无佐证，本庭难以采信。"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……需要用的时候就拿被告的话当口供，不利于她的时候就说是一面之词，这也太赖皮了吧。"},{t:"say",who:"文",inner:!1,act:"得意挺胸",text:"再说了，露米娅妹妹刚才就讲过，她那天早上只是因为肚子饿了想找点吃的哦。"},{t:"say",who:"文",inner:!1,act:"",text:"一只冷冰冰的破木箱子又不能当早饭啃——除非灵梦小姐能向本庭证明，您的赛钱箱其实是能吃的！"},{t:"say",who:"灵梦",inner:!1,act:"语塞",text:"能、能吃的赛钱箱……？"},{t:"say",who:"映姬",inner:!1,act:"举起悔悟棒",text:"辩方若无法指出证人撞击木箱之动机，则「证人自行滑行毁箱」之说便无从立脚。"},{t:"say",who:"魔理沙",inner:!1,act:"用手背挡着嘴，凑到灵梦耳边小声提醒",text:"喂，灵梦，别顺着她的歪理转啊！木箱子当然啃不动，可箱子里面装的东西呢？"}]},{key:"4|22|▶ 出示：证明证人有动机|",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"▶ 出示：证明证人有动机",h4:"",lines:[]},{key:"4|22|▶ 出示：证明证人有动机|出示错误证物（通用）",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"▶ 出示：证明证人有动机",h4:"出示错误证物（通用）",lines:[{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"辩方，此物并不能解释证人为何要冲向赛钱箱。博丽灵梦，你的善行扣除一星。"}]},{key:"4|22|▶ 出示：证明证人有动机|出示 E8《缘起》·露米娅",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"▶ 出示：证明证人有动机",h4:"出示 E8《缘起》·露米娅",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示 E8",text:"《幻想乡缘起》上写得明明白白，这小妖怪平时食量很大，饿急了什么都想咬一口。"},{t:"say",who:"文",inner:!1,act:"摇扇失笑",text:"哎呀，食量大跟啃木箱子可是两码事呢。难不成灵梦小姐觉得她饿得连神社的陈年老木头都想尝尝咸淡吗？"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"强词夺理。博丽灵梦，你的善行扣除一星。"}]},{key:"4|22|▶ 出示：证明证人有动机|出示 E3 现场照片③·赛钱箱特写",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"▶ 出示：证明证人有动机",h4:"出示 E3 现场照片③·赛钱箱特写",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示 E3",text:"看看这张赛钱箱特写，箱子都碎成这样了，里面装的东西肯定就是她的目标！"},{t:"say",who:"文",inner:!1,act:"歪头",text:"照片上只有一地碎木板、十二枚铜钱和一块木牌哦。铜钱和木牌总不能拿来填肚子吧？"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"此照片并无可供充饥之物。博丽灵梦，你的善行扣除一星。"}]},{key:"4|22|▶ 出示：证明证人有动机|出示 E5 赛钱箱账本（正解）",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"▶ 出示：证明证人有动机",h4:"出示 E5 赛钱箱账本（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示 E5",text:"谁说赛钱箱里没有吃的了？大记者，把我的赛钱箱账本翻开看清楚！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"账本上记着，那天早上箱子里除了三十七枚铜钱和一块绘马，还放着整整「洋糖一包」！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"对一个饿着肚子到处找零食的小妖怪来说，这包洋糖就是她冲向赛钱箱的动机！"},{t:"say",who:"露米娅",inner:!1,act:"两眼放光，咽了口口水",text:"哇～箱子里面原来藏着甜甜的糖果呀～早知道我就找一找了～"},{t:"say",who:"文",inner:!1,act:"嘴角勾起，啪地展开折扇遮住半张脸",text:"……呵呵呵。灵梦小姐，您果然一脚踩进本记者给您留好的坑里了呢！"},{t:"say",who:"灵梦",inner:!1,act:"一怔",text:"……什么？"},{t:"say",who:"文",inner:!1,act:"",text:"那本账本总共才记了三样东西，本记者早就倒背如流了！可您似乎忘了一条最要命的常识哦——"},{t:"say",who:"文",inner:!1,act:"",text:"不管是《幻想乡缘起》的记载，还是证人刚才亲口说的「黑漆漆的，见不着呀」，都证明她的黑暗球连她自己的视线都会挡住！"},{t:"say",who:"文",inner:!1,act:"一指灵梦",text:"更何况那包洋糖既用糖纸包着，又严严实实锁在木箱子里——一个在黑暗里什么都看不见的小妖怪，怎么可能隔着十五步瞧见箱子里的糖果呢？！"},{t:"say",who:"灵梦",inner:!1,act:"咬牙",text:"唔……！"},{t:"say",who:"文",inner:!1,act:"收扇一指",text:"既然她根本不知道箱子里有糖，那她就毫无冲向赛钱箱的动机！四季大人，辩方的无端指控已经彻底破产，请直接结案吧！"},{t:"say",who:"映姬",inner:!1,act:"",text:"证人既不知箱中有糖，此一动机便不成立。辩方博丽灵梦，你还有何话可说。"},{t:"say",who:"灵梦",inner:!1,act:"一拍桌子",text:"等一下！就算她不是为了箱子里的糖……那、那她也完全有别的理由撞上赛钱箱！"}]},{key:"4|22|▶ 选择 4：她为什么会撞上赛钱箱？|",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"▶ 选择 4：她为什么会撞上赛钱箱？",h4:"",lines:[]},{key:"4|22|▶ 选择 4：她为什么会撞上赛钱箱？|A 还是为了箱子里的洋糖",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"▶ 选择 4：她为什么会撞上赛钱箱？",h4:"A 还是为了箱子里的洋糖",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"说不定小妖怪的鼻子特别灵，隔着木箱子闻见了洋糖的甜味呢！"},{t:"say",who:"文",inner:!1,act:"无奈扶额",text:"哎呀，灵梦小姐，本记者刚才不是已经驳过这一条了吗？冰天雪地的，包在糖纸里又关在木箱里的糖哪传得出味儿呀。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"此说检方已驳，辩方勿再赘述。博丽灵梦，你的善行扣除一星。"}]},{key:"4|22|▶ 选择 4：她为什么会撞上赛钱箱？|B 没看见、刹不住，纯属意外（正解）",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"▶ 选择 4：她为什么会撞上赛钱箱？",h4:"B 没看见、刹不住，纯属意外（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"谁说撞碎箱子就一定得有预谋了！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"她自己也说了，她在黑球里什么都看不见！从床单里挣脱出来的时候没看清方向，一头栽在冰面上刹不住车，这才意外撞上了赛钱箱！"},{t:"say",who:"魔理沙",inner:!1,act:"一拍手",text:"对啊！她看不见，又冻得手脚不听使唤，哪还刹得住车咯！"},{t:"say",who:"文",inner:!1,act:"冷笑一声",text:"刹不住车？灵梦小姐，您忘了一件事吧——证人刚才在证言第二句里怎么说的？她说自己「连手都冻僵了，动不了」！"},{t:"say",who:"文",inner:!1,act:"",text:"再看看鸟居底下那张特写照片，琪露诺放出的寒气连石板路都冻上了厚冰！"},{t:"say",who:"文",inner:!1,act:"",text:"一个被极寒冻得连手脚都动不了的小妖怪，自己怎么可能在平地上滑出撞碎木箱的速度来？！"},{t:"say",who:"灵梦",inner:!1,act:"急得乱抓",text:"那、那说不定她也只是随口一说，其实当时根本就没冻僵呢！"},{t:"say",who:"魔理沙",inner:!1,act:"扯了扯灵梦的袖子，小声吐槽",text:"喂喂，灵梦，你昏头咯！证人自己都说冻得动不了，你倒先替她改起口来了！"},{t:"say",who:"文",inner:!1,act:"步步紧逼",text:"退一万步讲，就算她没冻僵好了！《幻想乡缘起》上写得清楚，露米娅妹妹平时移动靠的是「飞」，不是走，更不是溜冰！"},{t:"say",who:"文",inner:!1,act:"",text:"如果她当时手脚灵活、能自由活动，那她挣脱床单之后直接飞走不就完了吗？"},{t:"say",who:"文",inner:!1,act:"",text:"既然她是飞走的，地上那道十五步长的滑痕就绝不可能是她留下的，只能是琪露诺滑出来的！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"那、那她要是飞在半空不小心撞上赛钱箱的呢？！"},{t:"say",who:"文",inner:!1,act:"高声反问",text:"她要是飞过去撞的，请问参道冰面上那道整整十五步长的贴地滑痕，又是谁滑出来的？！"}]},{key:"4|22|▶ 选择 4：她为什么会撞上赛钱箱？|C 是被一阵大风刮过去的",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"▶ 选择 4：她为什么会撞上赛钱箱？",h4:"C 是被一阵大风刮过去的",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"那天早上风那么大，说不定她是刚从床单里钻出来，就被一阵妖风直接刮到赛钱箱上了！"},{t:"say",who:"文",inner:!1,act:"脸色一变，跳脚道",text:"喂！灵梦小姐您含沙射影谁呢！本记者那天早上可是将近七点钟才赶到现场的，她钻出床单那会儿刮什么风，跟本记者半文钱关系都没有哦！"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"现场并无狂风吹袭之证物。博丽灵梦，你的善行扣除一星。"}]},{key:"4|22|文的版本|",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"文的版本",h4:"",lines:[{t:"say",who:"文",inner:!1,act:"展开双翼，双手一摊",text:"四季大人，各位！把所有线索拼在一起，那天早上的真相其实再简单不过了！"},{t:"fx",label:"演出",text:"重放片头 ① 琪露诺落在鸟居下"},{t:"say",who:"文",inner:!1,act:"",text:"那天一大早，满肚子起床气的被告琪露诺飞上神社石阶，落在了鸟居正下方。就在这时，她瞧见晾衣绳上有一团裹着白床单乱扑腾的「怪物」！"},{t:"fx",label:"演出",text:"重放片头 ② 寒冰爆发，冰层顺着石板路冻过去"},{t:"say",who:"文",inner:!1,act:"",text:"琪露诺二话不说放出全力冷气，把整条参道连同床单里的露米娅一起冻成了冰块！"},{t:"fx",label:"演出",text:"重放片头 ③ 镜头贴地冲向赛钱箱，箱子四分五裂"},{t:"say",who:"文",inner:!1,act:"",text:'紧接着，琪露诺照她自己说的"先飞五步"，飞到晾衣绳底下一看，灵梦小姐根本不在家！'},{t:"say",who:"文",inner:!1,act:"",text:"一怒之下，她就顺着自己刚冻好的参道冰面一路滑过去，一脚踢碎了赛钱箱！"},{t:"say",who:"文",inner:!1,act:"啪地合上折扇",text:"至于床单里的露米娅妹妹，后来究竟是冻僵在原地，还是自己偷偷飞走了，根本无关紧要！"},{t:"say",who:"文",inner:!1,act:"",text:"因为从头到尾，有动机、有能力在冰面上滑行并踢碎箱子的，就只有被告琪露诺一人！"},{t:"say",who:"灵梦",inner:!0,act:"",text:"……糟糕。如果露米娅冻僵了就滑不动、没冻僵就会直接飞走，那参道上那道滑痕，确实怎么都安不到露米娅头上……！"},{t:"say",who:"映姬",inner:!1,act:"缓缓举起悔悟棒",text:"辩方博丽灵梦，检方之推论环环相扣。你若无法解释「证人冻僵之后何以自行滑出十五步并撞碎木箱」，本庭现在便要宣判——"}]},{key:"4|22|魔理沙申请推演|",batch:4,sec:"22",secTitle:"询问④ · 错误出示与正确指证",h3:"魔理沙申请推演",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"猛地一拍桌子跳起来，高举手里的迷你八卦炉",text:"等一下！！"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"啧，听大记者在这儿拿嘴皮子空口讲故事，差点连我都被绕进去咯！灵梦，往边上让让，这局交给我！"},{t:"say",who:"文",inner:!1,act:"挑眉",text:"哎呀，魔理沙小姐，到了这步田地，您还想变出什么戏法来呢？"},{t:"say",who:"魔理沙",inner:!1,act:"得意地转了转八卦炉",text:"戏法？序幕里阿求不是早登记过我的能力吗？"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"既然大记者一口咬定冻僵的小妖怪不可能自己滑出去，那我就用八卦炉把整个案发现场原封不动地投出来，咱们当场试一试！"},{t:"say",who:"文",inner:!1,act:"撇嘴",text:"切，案发经过刚才本记者已经讲得明明白白，哪还有什么推演的必要。"},{t:"say",who:"映姬",inner:!1,act:"抬手制止文",text:"慢。雾雨魔理沙，本庭倒也想亲眼看一看，你的八卦炉究竟能放出何等光景。准予推演。"},{t:"say",who:"阿求",inner:!1,act:"翻开书页提醒",text:"阿求依规提醒：八卦炉「推演」放映的只是魔理沙小姐脑中的推理模型，并非实质证据。且公堂之内，严禁将火力开启至 Master Spark 档位。"},{t:"say",who:"魔理沙",inner:!1,act:"坏笑",text:"放心放心，小小模型档，连根柱子都烤不焦！看好了——八卦炉，点火！"}]},{key:"4|23|推演开始 · 搭平面图|",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"推演开始 · 搭平面图",h4:"",lines:[{t:"fx",label:"演出",text:"推演开始"},{t:"bgm",text:"推演曲"},{t:"fx",label:"沙盘",text:"平面图｜八卦炉射出白色光线，在公堂半空交织成博丽神社参道的俯视黑底白线平面图：南边是石阶与鸟居，鸟居正北五步是晾衣绳和挂着的衣物，再往北十五步是赛钱箱与拜殿"},{t:"say",who:"灵梦",inner:!1,act:"抬头看着半空的光线",text:"……这就是你用八卦炉放出来的现场？我要做什么？"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"这是照着第一张参道全景照片搭出来的平面图！要想还原那天早上的经过，灵梦，你先帮我把当时在场的两个人摆到图上去！"}]},{key:"4|23|▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？|",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"",text:"首先第一个人！那天早上琪露诺放出全力冷气的那一刻，她人站在哪儿？在平面图上指出来吧！"}]},{key:"4|23|▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？|鸟居下（正解）",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？",h4:"鸟居下（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"指着鸟居正下方",text:"放冷气的那一刻，琪露诺就站在南边的鸟居正下方。"},{t:"fx",label:"沙盘",text:"摆琪露诺｜鸟居正下方亮起金光，浮现出一个长着冰翅膀的琪露诺小剪影记号"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"没错！第二张特写照片拍得清清楚楚，鸟居底下的冰层最厚，底下还封着她的脚印呢！"}]},{key:"4|23|▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？|赛钱箱",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？",h4:"赛钱箱",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"我觉得那时候她应该站在赛钱箱跟前……"},{t:"say",who:"魔理沙",inner:!1,act:"急忙一把按住灵梦的手",text:"喂喂，灵梦！这不对吧！要是她一开始就站在赛钱箱跟前放冷气，咱们刚才吵了半天的鸟居脚印和参道滑痕，不就全白费了吗？！"},{t:"say",who:"映姬",inner:!1,act:"威严",text:"辩护方有什么要说的吗？"},{t:"say",who:"灵梦",inner:!1,act:"干咳一声收回手",text:"……咳，哦，我正要说呢，其实被告当时站的位置应该是在……"}]},{key:"4|23|▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？|拜殿",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？",h4:"拜殿",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"她既然是来找我决斗的，当时应该站在拜殿屋里或者房顶上吧……"},{t:"say",who:"魔理沙",inner:!1,act:"满头黑线",text:"灵梦！她的脚印可是封在鸟居底下的冰里的，她连拜殿的台阶都没靠近过，怎么跑到上头去放冷气啊！"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩护方有什么要说的吗？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……我就是随手比划一下。其实被告当时站的位置应该是在……"}]},{key:"4|23|▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？|晾衣绳",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？",h4:"晾衣绳",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"我记得她好像站在晾衣绳底下……"},{t:"say",who:"魔理沙",inner:!1,act:"连连摆手",text:"停停停！晾衣绳上挂着的是把她吓破胆的「怪物」！她要是直接站在晾衣绳底下，早就被床单糊一脸咯！"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩护方有什么要说的吗？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……说得也是。其实被告当时站的位置应该是在……"}]},{key:"4|23|▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？|石阶",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？",h4:"石阶",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"她刚飞上山门，应该还站在外头的石阶底下吧……"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"不对不对！她的脚印可是明明白白封在鸟居正下方的冰层里的，说明她已经飞上石阶、落在鸟居底下了！"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩护方有什么要说的吗？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……哦，我手指头偏了一点。其实被告当时站的位置应该是在……"}]},{key:"4|23|▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？|其他地方（通用）",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 平面图 ① 琪露诺：放冷气那一刻，她站在哪？",h4:"其他地方（通用）",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"我觉得她当时应该站在这儿……"},{t:"say",who:"魔理沙",inner:!1,act:"扶额",text:"灵梦，别瞎指啊！咱们手里的第二张特写照片，不是早就拍下她放冷气时踩在哪儿了吗？"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩护方有什么要说的吗？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……我正要指那儿呢。其实被告当时站的位置应该是在……"}]},{key:'4|23|▶ 平面图 ② 露米娅："怪物"在哪？|',batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:'▶ 平面图 ② 露米娅："怪物"在哪？',h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"",text:"琪露诺就位！接下来第二个人——当琪露诺站在鸟居下放冷气的那一刻，把她吓了一跳的那团「怪物」露米娅，又在哪儿呢？"}]},{key:'4|23|▶ 平面图 ② 露米娅："怪物"在哪？|十字空洞床单（正解）',batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:'▶ 平面图 ② 露米娅："怪物"在哪？',h4:"十字空洞床单（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"指着晾衣绳正中间的大床单",text:"就在鸟居正北五步远、晾衣绳正中间挂着的那张大床单里。"},{t:"fx",label:"沙盘",text:"摆露米娅｜晾衣绳正中的大床单位置亮起金光，浮现出一颗拖着白布条的黑球记号"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"对咯！就是文那张自拍背景里拍到的、破了个十字大洞的冻床单！"}]},{key:'4|23|▶ 平面图 ② 露米娅："怪物"在哪？|晾衣绳上别的衣物',batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:'▶ 平面图 ② 露米娅："怪物"在哪？',h4:"晾衣绳上别的衣物",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"在晾衣绳挂着的这件衣服里吧……"},{t:"say",who:"魔理沙",inner:!1,act:"凑近平面图摆手",text:"喂喂，差一点点！灵梦你看清楚，这一件上面可完好无损、半个窟窿都没有，露米娅钻的不是这一件咯！"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩护方有什么要说的吗？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……晾得太密看岔了。其实她当时裹在里面的，是旁边那张……"}]},{key:'4|23|▶ 平面图 ② 露米娅："怪物"在哪？|鸟居下',batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:'▶ 平面图 ② 露米娅："怪物"在哪？',h4:"鸟居下",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"应该也在鸟居底下吧……"},{t:"say",who:"魔理沙",inner:!1,act:"哭笑不得",text:"喂！鸟居底下已经站着琪露诺了！难不成当时露米娅正蹲在琪露诺头顶上跟她一起看风景吗？！"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩护方有什么要说的吗？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……我就是看琪露诺站那儿挺孤单的。其实露米娅当时应该在……"}]},{key:'4|23|▶ 平面图 ② 露米娅："怪物"在哪？|赛钱箱',batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:'▶ 平面图 ② 露米娅："怪物"在哪？',h4:"赛钱箱",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"她当时应该已经在赛钱箱那儿了……"},{t:"say",who:"魔理沙",inner:!1,act:"急忙打断",text:"不对不对！放冷气的时候她要是已经在赛钱箱那儿了，那晾衣绳床单上那个从里往外裂开的十字冰洞是谁撑破的呀！"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩护方有什么要说的吗？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……哦，我顺手点到终点去了。其实冷气打来的时候，她人应该在……"}]},{key:'4|23|▶ 平面图 ② 露米娅："怪物"在哪？|树林',batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:'▶ 平面图 ② 露米娅："怪物"在哪？',h4:"树林",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"按照她一开始的证言，她当时在参道旁边的树林里……"},{t:"say",who:"魔理沙",inner:!1,act:"瞪大眼睛",text:"灵梦！你睡迷糊了？！「在树林里看见踢箱子」是她被大记者忽悠出来的假话，咱们在上一轮询问里费了老大劲才刚拆穿的！"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩护方有什么要说的吗？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……我就是顺口试探一下。其实她当时真正待的地方是在……"}]},{key:'4|23|▶ 平面图 ② 露米娅："怪物"在哪？|其他地方（通用）',batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:'▶ 平面图 ② 露米娅："怪物"在哪？',h4:"其他地方（通用）",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"我觉得那团黑影当时应该在这儿……"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"怎么会在那儿啊！咱们刚才在文那张自拍的背景里，不是已经找到她留下的那个十字形「模子」了吗？"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩护方有什么要说的吗？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……我正要指那个地方呢。其实她当时应该在……"}]},{key:"4|23|立起来|",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"立起来",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"嘴角一扬，转动八卦炉上的刻度环",text:"两个人的位置全都对上咯！不过光看一张扁平的纸面可瞧不出门道——给我立起来！"},{t:"fx",label:"沙盘",text:"立起来｜镜头猛地从正上方压低，平面图上的白色线条拔地而起，瞬间升起成一座黑底白线的立体神社场景：立体的鸟居、半空的晾衣绳与床单、尽头的赛钱箱与拜殿一览无余"},{t:"say",who:"琪露诺",inner:!1,act:"扒着被告席栏杆，瞪圆了眼睛",text:"哇——！平平的画一下子站起来啦！好帅气啦！"},{t:"say",who:"小町",inner:!1,act:"从柱子后面探出头，揉了揉眼睛",text:"呼啊……现在的年轻魔法使，手艺还真是不赖呐。"},{t:"say",who:"映姬",inner:!1,act:"微微睁大眼睛，凝视半空",text:"……立体的？"},{t:"say",who:"文",inner:!1,act:"握紧相机，强自镇定",text:"哎、哎呀，少在这儿故弄玄虚了！就算把画面变成立体的，物理规律也不会跟着变哦！"}]},{key:"4|23|放演 · 平冰|",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"放演 · 平冰",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"",text:"急什么，咱们这就照大记者刚才那套说法放演一遍瞧瞧！"},{t:"fx",label:"沙盘",text:'平冰｜鸟居下的琪露诺记号放出一道白光，一层平整均匀的白色冰面铺满参道，半空的床单与黑球一同冻住；停了一拍，床单中央"咔"地裂开十字缺口，挂着白布条的黑球笔直掉下来，"咚"地砸在平整的冰面上，纹丝不动'},{t:"say",who:"文",inner:!1,act:"用折扇掩嘴大笑",text:"哈哈哈！大家都亲眼看见了吧！从晾衣绳上竖直掉下来，砸在冰面上根本连半步都不会往前滑！参道上那道十五步长的滑痕，果然只能是琪露诺滑出来的！"},{t:"say",who:"魔理沙",inner:!1,act:"抱起胳膊，坏笑摇头",text:"啧啧，大记者别高兴得太早咯。为什么这颗黑球掉下来不动弹？因为现在这个模型里，有一处地方和那天早上的真实案发现场完全不一样！"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"灵梦，你可以把模型拖着转一转、换个角度仔细瞧瞧——找出模型里哪儿不对劲，再拿证据砸过去！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"",lines:[]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|冰层 × E6（正解）",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"冰层 × E6（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"指向参道冰层，出示 E6",text:"不对劲的地方，就是参道上铺着的这层冰！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"《幻想乡缘起》上写得清清楚楚，琪露诺的冷气是从她自己身上放出来的，「离她越近，冻得越厚」！"},{t:"say",who:"魔理沙",inner:!1,act:"一拍手",text:"对咯！冷气既然是从南边鸟居底下的琪露诺身上放出来的，那整条参道的冰面怎么可能一样厚——那天的冰面，根本就不是平的！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|鸟居脚下 × E2（正解）",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"鸟居脚下 × E2（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"指向鸟居脚下，出示 E2",text:"不对劲的地方在鸟居脚下！看看第二张特写照片，鸟居正下方的冰层冻得跟石头一样厚，连琪露诺的脚印都整个封在了里面！"},{t:"say",who:"魔理沙",inner:!1,act:"一拍手",text:"对咯！《幻想乡缘起》上也写着，她的冷气离自己越近冻得越厚——既然鸟居底下冻得最厚，越往北边的赛钱箱就越薄，那天的冰面根本就不是平的！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|赛钱箱底 × E3（正解）",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"赛钱箱底 × E3（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"指向赛钱箱底部，出示 E3",text:"看看赛钱箱底部的特写照片吧！鸟居底下的冰冻得那么厚，可到了二十步外的赛钱箱底座，却只冻了薄薄一层冰！"},{t:"say",who:"魔理沙",inner:!1,act:"一拍手",text:"对咯！对照《幻想乡缘起》里「离她越近冻得越厚」的记载，冷气从南边的鸟居吹到北边的赛钱箱，冰层由厚变薄——那天的冰面，根本就不是平的！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|P:琪露诺 · 冰壶",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"P:琪露诺 · 冰壶",lines:[{t:"say",who:"魔理沙",inner:!1,act:"",text:"琪露诺的档案？你是说琪露诺在鸟居底下顺脚把掉下来的黑球当冰壶踢出去了？行，放出来瞧瞧！"},{t:"fx",label:"沙盘",text:"冰壶｜立体鸟居下，琪露诺剪影助跑一脚踢在黑球上，黑球滑出，琪露诺闪现到前面拿着扫帚拼命刷冰"},{t:"say",who:"琪露诺",inner:!1,act:"在被告席拍手欢呼",text:"哇！刷冰刷冰！最强的我连打冰壶都是最强的啦！"},{t:"say",who:"魔理沙",inner:!1,act:"八卦炉噗地冒出一股黑烟，捂脸",text:"咳咳咳！想歪咯！全景照片上鸟居底下那五步冰霜干干净净的，她俩什么时候组队打过冰壶啊！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|Y3 小町 · 缩地",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"Y3 小町 · 缩地",lines:[{t:"say",who:"魔理沙",inner:!1,act:"",text:"小町的《缘起》？上面写着她能把两处之间的距离缩短……你是说有个偷懒的死神把黑球一步送到了赛钱箱跟前？放出来瞧瞧！"},{t:"fx",label:"沙盘",text:'缩地｜立体场景半空划出一艘小木船，扛着大镰刀的小町剪影打着哈欠随手一挥，赛钱箱上方的空气"啵"地裂开，黑球凭空掉下来砸在箱子上'},{t:"say",who:"小町",inner:!1,act:"从柱子后面探出半个脑袋，打了个哈欠",text:"呼啊——？喂喂，魔理沙，模型里那个划着船乱扔黑球的家伙，怎么长得跟我一模一样呐？我那天早上可是在三途川睡大觉的！"},{t:"say",who:"魔理沙",inner:!1,act:"八卦炉噗地冒出一股黑烟",text:"咳咳！也是，要真是一步掉在箱子跟前，那参道冰面上足足十五步长的滑痕，难不成是赛钱箱自己溜冰滑出来的吗！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|P:魔理沙 · 扫帚",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"P:魔理沙 · 扫帚",lines:[{t:"say",who:"魔理沙",inner:!1,act:"",text:"……拿我的档案干嘛？！你是说现场有什么能让她踩着滑过去的家伙什？喂喂，你脑子里想的该不会是——"},{t:"fx",label:"沙盘",text:"扫帚｜黑球一脚踩在一把立体的魔女扫帚上，像踩着冲浪板一样顺着参道冰面潇洒漂移了过去"},{t:"say",who:"魔理沙",inner:!1,act:"八卦炉冒出一股黑烟，老脸一红",text:"咳咳！停停停！怎么把我的扫帚给放出来了！那天早上我的扫帚明明好好地搁在家里睡觉呢！"},{t:"say",who:"文",inner:!1,act:"眼睛一亮，举起羽毛笔",text:"哎呀，魔理沙小姐的扫帚涉嫌提供作案交通工具？这可是独家猛料呢！"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"现场照片上连根扫帚毛都没有，你少在那儿乱记咯！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|E5 账本 · 吸铁石",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"E5 账本 · 吸铁石",lines:[{t:"say",who:"魔理沙",inner:!1,act:"",text:"赛钱箱账本？里头记着一包洋糖……你是说箱子里的糖像吸铁石一样把她吸过去的？放！"},{t:"fx",label:"沙盘",text:'吸铁石｜尽头的立体赛钱箱自动掀开盖子放出闪光波纹，把掉在半空的黑球"嗖"地一下横吸了过去，一头扎进箱口'},{t:"say",who:"露米娅",inner:!1,act:"摸着肚子点头",text:"唔～要是真有会自己飞过来的糖果就好了呀～"},{t:"say",who:"文",inner:!1,act:"摇扇冷笑",text:"灵梦小姐，本记者刚才不是证明过了吗？她在黑暗里什么都看不见，闻不着也瞧不见箱子里的糖哦！"},{t:"say",who:"魔理沙",inner:!1,act:"八卦炉冒出一股黑烟",text:"咳咳！这招刚才确实已经被驳倒咯，换个思路！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|E1",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"E1",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"看看第一张参道全景照片，上面明明有一道十五步长的滑痕！"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"滑痕是她滑过去之后留下的结果，咱们现在要找的，是模型里缺了什么才害得她没法滑起来！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|E9",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"E9",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"文那张自拍背景里的冻床单，会不会有什么问题？"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"床单的位置和上面裂开的十字大洞，模型里都已经原封不动做上去了，问题不出在床单上！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|E8 或 P:露米娅",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"E8 或 P:露米娅",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"会不会是露米娅身上的黑暗球有什么不对？"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"你看模型里，她从头到尾都是一颗实打实的黑球呀，问题不在她身上！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|正解证物点错位置",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"正解证物点错位置",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"我手里的这件证据，能说明刚才指的那个地方不对劲……"},{t:"say",who:"魔理沙",inner:!1,act:"歪头看了一眼模型",text:"咦？灵梦，你手里的证据倒是挺有意思，可它说的跟你在模型上指的那个位置完全对不上号呀！看准位置再指一次吧！"}]},{key:"4|23|▶ 指出：模型里哪里和现场不一样？|其他（通用）",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"▶ 指出：模型里哪里和现场不一样？",h4:"其他（通用）",lines:[{t:"say",who:"魔理沙",inner:!1,act:"八卦炉噗地冒出一缕黑烟",text:"咳咳……拿这个塞进炉子里，模型可是一点反应都没有。再仔细转转模型，看看现场到底哪儿跟模型不一样！"}]},{key:"4|23|变形|",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"变形",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"打了个响指，八卦炉金光大盛",text:"抓到关键了！既然离琪露诺越近冰就越厚，那咱们就把那天早上真实的冰层厚度，原原本本加进模型里！"},{t:"fx",label:"沙盘",text:"冰丘｜以鸟居正下方的琪露诺记号为中心，参道冰层猛地向上鼓起一座圆拱形的冰丘，一圈圈白色等高线从鸟居往四周荡开；镜头旋转到正侧面，能清晰看见冰面从鸟居往北边的赛钱箱一路向下倾斜"},{t:"say",who:"灵梦",inner:!1,act:"眼角一抽",text:"……慢着，那天早上的冰就算再厚，也没堆成小山包这么夸张吧。"},{t:"say",who:"魔理沙",inner:!1,act:"嬉皮笑脸地比划",text:"嘿嘿，高低差我可是放大了好几倍！不放大一点，怎么让对面那位眼神不好的大记者一眼看明白呢？"},{t:"say",who:"文",inner:!1,act:"脸色骤变，往后退了半步",text:"什、什么？！以鸟居为顶点、往四周变低的……冰丘？！"}]},{key:"4|23|放演 · 冰坡|",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"放演 · 冰坡",h4:"",lines:[{t:"say",who:"魔理沙",inner:!1,act:"叉腰大笑",text:"看好了大记者！在这座以琪露诺为顶点的冰丘上，把刚才那一幕重新放演一遍——点火！"},{t:"fx",label:"沙盘",text:"冰坡｜冷气散开形成高耸的同心圆冰丘 → 半空床单裂开十字缺口，挂着白布条的黑球笔直坠落，砸在鸟居正北五步的冰丘斜面上 → 黑球顺着背离鸟居的下坡方向往前滑去，越滑越快 → 镜头贴着冰面高速跟拍（与片头第 3 段贴地冲刺镜头一致） → 慢镜头：黑球结结实实撞上尽头的赛钱箱，冻在冰里的箱底纹丝不动，上半截箱身当场炸裂四散，铜钱顺着下坡继续往北滑落"},{t:"say",who:"琪露诺",inner:!1,act:"在被告席上跳起来鼓掌欢呼",text:"哇——！！全中！露米娅变成大黑球滚下去，比最强的我还会打保龄球啦！"},{t:"say",who:"露米娅",inner:!1,act:"平伸的双臂一下子垂了下来",text:"哇～黑球滑得好快哦～……不、不过那个才不是我哦～"},{t:"sfx",text:"叮当"}]},{key:"4|23|推演完毕 · 收尾|",batch:4,sec:"23",secTitle:"询问④ · 魔理沙「八卦炉推演」",h3:"推演完毕 · 收尾",h4:"",lines:[{t:"fx",label:"演出",text:"推演完毕"},{t:"say",who:"魔理沙",inner:!1,act:"吹了吹八卦炉口，得意一指",text:"看见了吧！只要把琪露诺「近厚远薄」的冰丘加进去，刚才大记者所谓的死局，一瞬间就全解开咯！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"第一，那天早上的冰面是以鸟居为顶点的冰丘。露米娅从床单里挣脱掉下来，正好砸在冰丘的斜坡上——哪怕她冻僵了一动不动，也会自己顺着冰坡往下滑！"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"第二，在同心圆的冰丘上，任何东西都会往正背对鸟居的下坡方向滑！"},{t:"say",who:"魔理沙",inner:!1,act:"",text:"晾衣绳上的破洞床单在鸟居正北，顺着下坡笔直滑出去十五步，正前方不偏不倚就是赛钱箱！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"第三，赛钱箱的底座早就被冻死在冰里挪不动了。一颗大黑球顺着冰坡加速冲下来，这一下撞击的力道全砸在上半截木头上，箱子当然会被当场撞得四分五裂！"},{t:"say",who:"文",inner:!1,act:"满头冷汗，强辩道",text:"可、可就算露米娅掉下来会顺坡滑出去，也不能排除琪露诺也滑过去踢了一脚呀！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"全景照片上，从头到尾就只有一道滑痕。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"而且那道滑痕是从床单正下方直接压出来的宽大球形滑槽，起点周围干干净净，连半个落地蹬冰的脚印都没有——琪露诺根本就没滑过！"},{t:"say",who:"魔理沙",inner:!1,act:"双手叉腰，笑眯眯地看着文",text:"最重要的一点——大记者，你刚才不是逼着我们找露米娅砸箱子的「动机」吗？"},{t:"say",who:"灵梦",inner:!1,act:"抱臂冷哼",text:"一个被冻僵的小妖怪，掉在光滑的冰坡上自己溜了下去，一头撞上了冻在坡底的赛钱箱——这从头到尾就是一场意外。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"既然是意外，她从一开始就不需要任何动机！"},{t:"say",who:"文",inner:!1,act:"如遭雷击，折扇差点掉在地上",text:"意、意外不需要动机……？！呃啊啊——！"}]},{key:"4|24||",batch:4,sec:"24",secTitle:"询问④ · 推演之后：追问卡关与取证 E10",h3:"",h4:"",lines:[{t:"say",who:"文",inner:!1,act:"猛地回过神，摇着折扇大喊",text:"慢、慢着！就算你们用冰坡把意外说得再天花乱坠，那也只是魔理沙小姐用八卦炉放出来的一场光影戏而已！"},{t:"say",who:"文",inner:!1,act:"",text:"没有她亲身碰到赛钱箱的实质物证，本记者绝不承认！"},{t:"say",who:"映姬",inner:!1,act:"点头",text:"检方所言不无道理。八卦炉之推演虽已将物理经过阐明得合乎情理，然公堂断案终须凭实据。"},{t:"say",who:"映姬",inner:!1,act:"",text:"证人露米娅，本庭当面问你——你挣脱床单之后，究竟可曾撞上那只木箱？"},{t:"say",who:"露米娅",inner:!1,act:"平伸的双臂一下子塌了下来，缩着脖子直晃脑袋",text:"没、没碰过哦～我身上干干净净的，什么都没沾哦～"},{t:"sfx",text:"叮当"},{t:"say",who:"映姬",inner:!1,act:"",text:"证人既改称未曾碰过、身上也什么都没沾，书记官，将第四句证言予以修正。"},{t:"sys",text:"证言修正 S4 → S4′"},{t:"stmt",id:"S4′",who:"露米娅",act:"垂着手臂直摇头",text:"我才没有碰过那个木箱子哦～身上干干净净的，什么都没沾呢～"},{t:"say",who:"魔理沙",inner:!1,act:"咂嘴挠头",text:"……啧，这回把话堵得死死的。"}]},{key:"4|24|卡关 · 出示任何证物（通用）|",batch:4,sec:"24",secTitle:"询问④ · 推演之后：追问卡关与取证 E10",h3:"卡关 · 出示任何证物（通用）",h4:"",lines:[{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"此物不足以直接证明证人曾触碰木箱。博丽灵梦，你的善行扣除一星。"},{t:"say",who:"魔理沙",inner:!1,act:"小声凑过来",text:"啧，手头的照片和档案全翻遍了，没哪件能直接咬死她碰过箱子……既然她嘴上捂得这么严实，干脆再顺着她的话好好问问吧！"}]},{key:"4|24|追问 S4′|",batch:4,sec:"24",secTitle:"询问④ · 推演之后：追问卡关与取证 E10",h3:"追问 S4′",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"你说你身上干干净净的，什么都没沾。从冰面上一路滑过去，衣服怎么可能一点痕迹都没有。"},{t:"say",who:"露米娅",inner:!1,act:"低头拍了拍自己的黑裙子给大家看",text:"你看你看，真的没有木头渣渣哦～干干净净的～"},{t:"sfx",text:"叮当"},{t:"say",who:"魔理沙",inner:!1,act:"半月眼",text:"……又响了。你拍裙子的时候，到底是什么东西在响啊。"},{t:"say",who:"露米娅",inner:!1,act:"立刻按住裙摆，把头摇成拨浪鼓",text:"没响哦～什么都没响～"}]},{key:"4|24|追问 S5（卡关后）|",batch:4,sec:"24",secTitle:"询问④ · 推演之后：追问卡关与取证 E10",h3:"追问 S5（卡关后）",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:'都滑到拜殿门口了，你还坚持说自己"连见都没见过"那个木箱子吗。'},{t:"say",who:"露米娅",inner:!1,act:"双手一摊",text:"黑漆漆的，见不着呀～我真的不知道木箱子长什么样哦～"},{t:"say",who:"文",inner:!1,act:"得意摇扇",text:"灵梦小姐，您就算问上一百遍，露米娅妹妹身上没有木屑、眼睛又没看见箱子，这两条可是怎么都推不翻的呢！"}]},{key:"4|24|组合追问触发（S4′ 和 S5 都追问过之后，接在后问的那一句后面）|",batch:4,sec:"24",secTitle:"询问④ · 推演之后：追问卡关与取证 E10",h3:"组合追问触发（S4′ 和 S5 都追问过之后，接在后问的那一句后面）",h4:"",lines:[{t:"say",who:"灵梦",inner:!0,act:"",text:'……等等。"身上什么都没沾"，再加上"没见过木箱子"。'},{t:"say",who:"灵梦",inner:!0,act:"",text:"我怎么一直顺着她的话，光盯着她身上找东西呢。"},{t:"say",who:"灵梦",inner:!1,act:"抬起眼皮，嘴角微挑",text:"……原来如此。露米娅，你说你身上干干净净，也没见过木箱子。"},{t:"say",who:"灵梦",inner:!1,act:"",text:'可你没见过箱子，箱子却实打实地"见"过你。既然你身上没沾着箱子的木屑——那被撞碎的赛钱箱上，有没有沾着你留下的东西呢。'},{t:"say",who:"文",inner:!1,act:"笑容一僵",text:"什、什么？！"},{t:"say",who:"灵梦",inner:!1,act:"转头看向法警席",text:"小町。案发后收回来的赛钱箱残骸，现在就收在公堂后面的证物库里吧。"},{t:"say",who:"小町",inner:!1,act:"打了个哈欠，扛起镰刀",text:"呼啊——是在证物库没错呐。四季大人，辩护人要验看实物，批我用一下能力把那堆烂木头挪过来呗？"},{t:"say",who:"映姬",inner:!1,act:"",text:"准。"},{t:"say",who:"阿求",inner:!1,act:"提笔",text:"记下了。"},{t:"fx",label:"演出",text:"公堂中央空气一晃，一筐摔得四分五裂的赛钱箱残骸出现在证物台上"},{t:"fx",label:"演出",text:"证物 E10 赛钱箱残骸 收入法庭记录"},{t:"say",who:"小町",inner:!1,act:"甩了甩手",text:"来了来了——哎哟，断口上的木刺还挺扎手，这算工伤不？"},{t:"say",who:"映姬",inner:!1,act:"",text:"不算。辩方，残骸已至，请查验。"},{t:"fx",label:"演出",text:"查验 E10"}]},{key:"4|24|没查验就出示 E10|",batch:4,sec:"24",secTitle:"询问④ · 推演之后：追问卡关与取证 E10",h3:"没查验就出示 E10",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"指着证物台上的木筐",text:"证据就在这堆碎木头里。"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"辩方，你连证物台上的残骸都未曾仔细翻检，单凭一筐烂木头能证明什么。"},{t:"say",who:"映姬",inner:!1,act:"",text:"先将残骸里外查验清楚，找出确凿痕迹再来指证。博丽灵梦，你的善行扣除一星。"}]},{key:"4|24|指证 S4′ 或 S5 × E10 赛钱箱残骸 · 正解|",batch:4,sec:"24",secTitle:"询问④ · 推演之后：追问卡关与取证 E10",h3:"指证 S4′ 或 S5 × E10 赛钱箱残骸 · 正解",h4:"",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示 E10",text:"露米娅，不管你身上干不干净、眼睛有没有见过那个箱子——这根木刺都能证明，你结结实实地撞上过它。"},{t:"say",who:"露米娅",inner:!1,act:"探头看木刺",text:"咦～木刺上面有什么呀～？"},{t:"say",who:"灵梦",inner:!1,act:"",text:"赛钱箱裂开的木刺上，勾下了几根金色的短发。"},{t:"say",who:"文",inner:!1,act:"眼睛一亮，扇子直指辩护席",text:"金色的头发？！哎呀呀，那可未必是露米娅妹妹的呢！站在辩护席旁边的魔理沙小姐，不也是金发吗？！"},{t:"say",who:"魔理沙",inner:!1,act:"从椅子上弹起来，双手连摆",text:"喂喂喂！幻想乡金发的人多了去咯，怎么一有黄头发就先往我头上扣啊！那我要是掉根扫帚毛在现场，你们是不是还得判我的扫帚有罪啊！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"大记者，别急着乱攀咬。木刺上勾着的，可不止有金发。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"看清楚了，和金发缠在一起的，还有一撮白色的棉布纤维。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"再对照一下大记者那张自拍的背景——晾衣绳上那张冻硬的大床单下缘，正好被扯掉了一条白布。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"那天早上身上挂着我的床单布条、又长着一头金发撞上赛钱箱的人，满场就只有一个。"},{t:"say",who:"露米娅",inner:!1,act:"捂住脑袋，哇地叫了一声",text:"哇啊——！！"},{t:"fx",label:"演出",text:'露米娅崩溃——她身上的黑暗瞬间失控暴涨，一个直径一人高的纯黑圆球"嘭"地把整个证人席吞了进去！'},{t:"say",who:"露米娅",inner:!1,act:"黑球里传出闷闷的回音",text:"原来那天早上撞得我脑袋好痛的硬东西，不是路边的大石头，是灵梦的木箱子呀……是这样的吗～"},{t:"fx",label:"演出",text:"人物档案 露米娅 更新"}]},{key:"4|25||",batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:"",h4:"",lines:[{t:"say",who:"映姬",inner:!1,act:"",text:"物证俱在。赛钱箱确系证人露米娅自冻床单挣脱后跌落冰丘，顺坡滑行撞毁。"},{t:"say",who:"文",inner:!1,act:"死死攥着相机，额头全是冷汗",text:"等、等一下！就算箱子是露米娅妹妹不小心撞碎的，那失窃的香火钱呢？！"},{t:"say",who:"文",inner:!1,act:"语速飞快",text:"灵梦小姐的账本上记着足足三十七枚铜钱，可第三张现场照片的冰面上只散落着十二枚！"},{t:"say",who:"文",inner:!1,act:"",text:"琪露诺小姐身上一枚都没有，难不成剩下的二十五枚铜钱自己长翅膀飞走了吗？！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"……那二十五枚铜钱当然不会飞。它们是被撞碎箱子的人顺手拿走了。"},{t:"say",who:"文",inner:!1,act:"反问",text:"哈！要是真有人拿走了钱，哪有小偷抓走了二十五枚——"},{t:"say",who:"文",inner:!1,act:"",text:"偏偏把冰面上那十二枚摆在明面上的铜钱留着不拿呢？！"}]},{key:"4|25|▶ 选择 3：拿钱的人为什么留下了冰面上看得见的十二枚铜钱？|",batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:"▶ 选择 3：拿钱的人为什么留下了冰面上看得见的十二枚铜钱？",h4:"",lines:[]},{key:"4|25|▶ 选择 3：拿钱的人为什么留下了冰面上看得见的十二枚铜钱？|A 嫌铜钱太重拿不动",batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:"▶ 选择 3：拿钱的人为什么留下了冰面上看得见的十二枚铜钱？",h4:"A 嫌铜钱太重拿不动",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"大概是因为三十七枚铜钱太沉了，她拿不动，所以留了十二枚在地上吧。"},{t:"say",who:"魔理沙",inner:!1,act:"吐槽",text:"喂，二十五枚和三十七枚能差几两重啊？连小妖精都能揣着跑好不好！"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"此说不通。博丽灵梦，你的善行扣除一星。"}]},{key:"4|25|▶ 选择 3：拿钱的人为什么留下了冰面上看得见的十二枚铜钱？|B 捡钱时被人打断了",batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:"▶ 选择 3：拿钱的人为什么留下了冰面上看得见的十二枚铜钱？",h4:"B 捡钱时被人打断了",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"她正在捡钱的时候，听见有人过来了，所以慌慌张张地丢下十二枚跑掉了。"},{t:"say",who:"文",inner:!1,act:"冷笑",text:"那时候琪露诺小姐早就逃走了，本记者又是将近七点才飞到神社的，哪有第三个人去打断她呢？"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"无据臆测。博丽灵梦，你的善行扣除一星。"}]},{key:"4|25|▶ 选择 3：拿钱的人为什么留下了冰面上看得见的十二枚铜钱？|C 她看不见（正解）",batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:"▶ 选择 3：拿钱的人为什么留下了冰面上看得见的十二枚铜钱？",h4:"C 她看不见（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"",text:"……理由简单得很。因为拿钱的那个人，当时根本看不见地上有钱。"},{t:"say",who:"文",inner:!1,act:"一怔",text:"看不见？！"},{t:"say",who:"灵梦",inner:!1,act:"嘴角微扬",text:"没错，看不见——这可是刚才争论洋糖动机的时候，大记者您亲口替我们证明过的。"},{t:"say",who:"映姬",inner:!1,act:"",text:"辩方，你说拿钱之人看不见，现场可有实据支撑？"}]},{key:'4|25|▶ 终局出示 1：证明"拿钱的人当时看不见" · 正解：E3 现场照片③·赛钱箱特写|',batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:'▶ 终局出示 1：证明"拿钱的人当时看不见" · 正解：E3 现场照片③·赛钱箱特写',h4:"",lines:[]},{key:'4|25|▶ 终局出示 1：证明"拿钱的人当时看不见" · 正解：E3 现场照片③·赛钱箱特写|出示错误证物（通用）',batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:'▶ 终局出示 1：证明"拿钱的人当时看不见" · 正解：E3 现场照片③·赛钱箱特写',h4:"出示错误证物（通用）",lines:[{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:"此物无法证明拿钱之人是在看不见的情形下取走财物。博丽灵梦，你的善行扣除一星。"}]},{key:'4|25|▶ 终局出示 1：证明"拿钱的人当时看不见" · 正解：E3 现场照片③·赛钱箱特写|出示 E8《缘起》·露米娅',batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:'▶ 终局出示 1：证明"拿钱的人当时看不见" · 正解：E3 现场照片③·赛钱箱特写',h4:"出示 E8《缘起》·露米娅",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示 E8",text:"阿求的档案上写得很清楚，露米娅在黑暗里什么都看不见。"},{t:"say",who:"文",inner:!1,act:"摇扇反击",text:"哎呀，档案只能说明露米娅妹妹看不见。可当时在冰面上拿走铜钱的人到底是不是她，灵梦小姐还没拿出现场证据呢！"},{t:"say",who:"映姬",inner:!1,act:"敲击悔悟棒",text:'本庭所问，乃是现场何处痕迹可证"拿钱之人看不见"，而非证人之习性。博丽灵梦，你的善行扣除一星。'}]},{key:'4|25|▶ 终局出示 1：证明"拿钱的人当时看不见" · 正解：E3 现场照片③·赛钱箱特写|出示 E3 现场照片③·赛钱箱特写（正解）',batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:'▶ 终局出示 1：证明"拿钱的人当时看不见" · 正解：E3 现场照片③·赛钱箱特写',h4:"出示 E3 现场照片③·赛钱箱特写（正解）",lines:[{t:"say",who:"灵梦",inner:!1,act:"出示 E3",text:"证据就在第三张赛钱箱特写照片上。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"你们仔细看破碎的赛钱箱周围——那层薄薄的白霜上面，留着一大片杂乱无章的手印。"},{t:"say",who:"魔理沙",inner:!1,act:"凑近照片",text:"还真是！要是一眼就能看见铜钱掉在哪儿，直接伸手捡起来不就完了吗？怎么会在冰霜上到处胡乱摸一气！"},{t:"say",who:"灵梦",inner:!1,act:"",text:"因为撞碎箱子的露米娅当时还裹在自己的黑暗球里，什么都看不见。"},{t:"say",who:"灵梦",inner:!1,act:"",text:"她只知道肚子饿了，在地上摸到圆圆的小东西就往兜里塞——至于滑得稍远一点的那十二枚铜钱，她没摸到，自然就留在冰面上了。"},{t:"say",who:"灵梦",inner:!1,act:"盯向证人席上的黑球",text:'我说的对吧，露米娅。从你走上证人席开始，每次一晃身子就会传出来的那个"叮当"声——现在，把你的口袋翻出来给大家看看吧。'},{t:"fx",label:"演出",text:"证人席上的黑球慢慢散开，露米娅眨巴着眼睛，慢吞吞地把手伸进裙子口袋，掏出一大把铜钱和一张花花绿绿的糖纸"},{t:"sfx",text:"哗啦啦——叮当！"},{t:"say",who:"露米娅",inner:!1,act:"委屈地瘪着嘴",text:"给～原来这不是糖呀～我就说你们神社的糖怎么这么硬，咬了半天都咬不动哦～"},{t:"fx",label:"演出",text:"证物 E11 露米娅的口袋（25 枚带牙印的铜钱 + 一张印着蝙蝠纹的洋糖纸）收入法庭记录"},{t:"say",who:"魔理沙",inner:!1,act:"目瞪口呆地数了数",text:"一、二、三……二十五枚！而且每一枚上面都留着小牙印！"},{t:"say",who:"魔理沙",inner:!1,act:"",text:'搞了半天，小冰精说的什么"秘密基地"，其实就是露米娅的裙子口袋啊！'},{t:"say",who:"文",inner:!1,act:"脸色发白，死死抓住最后一根稻草",text:'……二、二十五枚又怎么样！天底下的铜钱长得都一个样，上面又没刻着"博丽神社"四个字！谁知道是不是露米娅妹妹从别处捡来的呀？！'},{t:"say",who:"映姬",inner:!1,act:"",text:"检方所言亦有一理。辩方，你若断言证人口袋中之铜钱即是赛钱箱失窃之物，可有确凿凭据？"}]},{key:'4|25|▶ 终局出示 2（绝杀）：证明"这些铜钱就是赛钱箱里的" · 正解：E5 赛钱箱账本|',batch:4,sec:"25",secTitle:"终局推理 · 消失的香火钱",h3:'▶ 终局出示 2（绝杀）：证明"这些铜钱就是赛钱箱里的" · 正解：E5 赛钱箱账本',h4:"",lines:[]},{key:'4|25|▶ 终局出示 2（绝杀）：证明
